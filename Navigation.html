<!DOCTYPE html>
<html>
<head>
    <title>AR Navigation Test</title>
</head>

<body>

<h2>Check Console for Route Data</h2>

<script>
navigator.geolocation.getCurrentPosition(async (pos) => {

    let userLat = pos.coords.latitude;
    let userLng = pos.coords.longitude;

    console.log("User Location:", userLat, userLng);

    // 👉 CHANGE THIS DESTINATION (near your location)
    let destination = "12.9725,79.1650";

    let apiKey = "AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA"; // 🔥 PUT YOUR API KEY

    let url = `https://cors-anywhere.herokuapp.com/https://maps.googleapis.com/maps/api/directions/json?origin=${userLat},${userLng}&destination=${destination}&key=${apiKey}`;

    try {
        let response = await fetch(url);
        let data = await response.json();

        // 🔍 PRINT FULL RESPONSE
        console.log("FULL RESPONSE:");
        console.log(JSON.stringify(data, null, 2));

        // ✅ SAFE CHECK
        if (data.routes && data.routes.length > 0) {
            let polyline = data.routes[0].overview_polyline.points;
            console.log("Polyline:", polyline);
        } else {
            console.log("❌ No routes found OR API issue");
            console.log("STATUS:", data.status);
        }

    } catch (error) {
        console.error("Error:", error);
    }

});
</script>

</body>
</html>
