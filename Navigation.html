<!DOCTYPE html>
<html>
<head>
    <title>AR Navigation - Step 1</title>
</head>

<body>

<h2>Check Console for Route Data</h2>

<script>

// 🔑 PUT YOUR API KEY HERE
const apiKey = "AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA";

// 📍 Destination (you can change this)
const destination = "Vellore Institute of Technology";

// 📍 Get User Location
navigator.geolocation.getCurrentPosition(function(position) {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    console.log("User Location:", lat, lng);

    // 🚀 Google Directions API URL
    const url = `https://maps.googleapis.com/maps/api/directions/json?origin=${lat},${lng}&destination=${destination}&key=${apiKey}`;

    fetch(url)
    .then(response => response.json())
    .then(data => {

        console.log("FULL RESPONSE:", data);

        if (data.status === "OK") {

            const polyline = data.routes[0].overview_polyline.points;

            console.log("Encoded Polyline:", polyline);

            const decoded = decodePolyline(polyline);

            console.log("Decoded Points:", decoded);

        } else {
            console.log("❌ ERROR:", data.status);
        }

    })
    .catch(error => console.error("Fetch Error:", error));

});

// 🔥 POLYLINE DECODER FUNCTION
function decodePolyline(encoded) {
    let points = [];
    let index = 0, len = encoded.length;
    let lat = 0, lng = 0;

    while (index < len) {
        let b, shift = 0, result = 0;

        do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
        } while (b >= 0x20);

        let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lat += dlat;

        shift = 0;
        result = 0;

        do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
        } while (b >= 0x20);

        let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lng += dlng;

        points.push({
            lat: lat / 1e5,
            lng: lng / 1e5
        });
    }

    return points;
}

</script>

</body>
</html>
