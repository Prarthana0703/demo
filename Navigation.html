<!DOCTYPE html>
<html>
<head>
    <title>AR Navigation Fixed</title>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA"></script>
</head>

<body>

<h2>Check Console for Route Data</h2>

<script>

navigator.geolocation.getCurrentPosition(function(position) {

    const origin = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
    };

    console.log("User Location:", origin);

    const destination = "Vellore Institute of Technology";

    const directionsService = new google.maps.DirectionsService();

    directionsService.route(
        {
            origin: origin,
            destination: destination,
            travelMode: google.maps.TravelMode.WALKING
        },
        function(result, status) {

            console.log("STATUS:", status);

            if (status === "OK") {

                console.log("FULL RESPONSE:", result);

                const route = result.routes[0].overview_path;

                console.log("Decoded Points:", route);

            } else {
                console.log("❌ Error:", status);
            }
        }
    );

});

</script>

</body>
</html>
