<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saira's Wedding 💍</title>

    <!-- A-Frame + AR.js loaded on demand when user taps AR Schedule -->
    <!-- Scripts injected dynamically in openARSchedule() -->

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { font-family: 'Georgia', serif; background: #0D0014; color: #fff; overflow-x: hidden; }

        /* ══ LOADING ══ */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999; background: #0D0014;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            transition: opacity 0.8s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-ring {
            width: 64px; height: 64px;
            border: 3px solid rgba(255,182,193,0.2);
            border-top-color: #FF6B9D; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: rgba(255,182,193,0.7); font-size: 15px; letter-spacing: 2px; }

        /* ══ PETALS ══ */
        .petals-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .petal { position: absolute; border-radius: 50%; opacity: 0.6; animation: fall linear infinite; }
        @keyframes fall {
            0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ══ LANDING PAGE ══ */
        #landing {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 28px 20px;
            background: radial-gradient(ellipse at top, #1a0028 0%, #0D0014 70%);
        }

        /* Invite card */
        .invite-card {
            position: relative; z-index: 2;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,182,193,0.3);
            border-radius: 22px; padding: 36px 28px;
            max-width: 370px; width: 100%;
            text-align: center; backdrop-filter: blur(12px);
            animation: fadeUp 1s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(32px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .eyebrow { color: rgba(255,182,193,0.7); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; }
        .names   { color: #FFB6C1; font-size: 36px; font-weight: 700; line-height: 1.1; }
        .amp     { color: rgba(255,182,193,0.45); font-size: 22px; margin: 6px 0; display: block; }
        .divider { width: 56px; height: 1px; background: rgba(255,182,193,0.3); margin: 18px auto; }
        .detail  { color: #fff; font-size: 14px; margin: 5px 0; }
        .ring    { font-size: 50px; margin: 20px 0 0; display: block; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.09); } }

        /* ══ COUNTDOWN ══ */
        .countdown-wrap {
            position: relative; z-index: 2;
            width: 100%; max-width: 370px; margin-top: 16px;
            background: rgba(255,182,193,0.06);
            border: 1px solid rgba(255,182,193,0.2);
            border-radius: 16px; padding: 14px 10px;
            text-align: center;
            animation: fadeUp 1.1s ease both;
        }
        .countdown-label {
            color: rgba(255,182,193,0.55); font-size: 11px;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;
        }
        .countdown-boxes { display: flex; justify-content: center; gap: 8px; }
        .cd-box {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255,59,127,0.13);
            border: 1px solid rgba(255,59,127,0.32);
            border-radius: 10px; padding: 9px 12px; min-width: 56px;
        }
        .cd-num  { color: #FFB6C1; font-size: 26px; font-weight: 700; font-family: monospace; line-height: 1; }
        .cd-unit { color: rgba(255,182,193,0.45); font-size: 9px; letter-spacing: 1px; margin-top: 4px; }

        /* ══ BUTTONS ══ */
        .btn-group {
            position: relative; z-index: 2;
            width: 100%; max-width: 370px; margin-top: 16px;
            display: flex; flex-direction: column; gap: 11px;
            animation: fadeUp 1.2s ease both;
        }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 15px 20px;
            border-radius: 14px; border: none; cursor: pointer;
            font-size: 15px; font-weight: 700; font-family: 'Georgia', serif;
            text-align: center; text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:active { transform: scale(0.96); }

        /* Button 1 — AR Invitation */
        .btn-invite {
            background: linear-gradient(135deg, #FF3B7F 0%, #c0255a 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255,59,127,0.35);
        }
        .btn-invite:active { box-shadow: 0 2px 8px rgba(255,59,127,0.2); }

        /* Button 2 — AR Navigation */
        .btn-nav {
            background: rgba(0,200,255,0.12);
            color: #00C8FF;
            border: 1px solid rgba(0,200,255,0.4);
            box-shadow: 0 4px 16px rgba(0,200,255,0.12);
        }
        .btn-nav:active { box-shadow: none; }

        /* Button 3 — AR Schedule */
        .btn-schedule {
            background: rgba(255,182,193,0.1);
            color: #FFB6C1;
            border: 1px solid rgba(255,182,193,0.35);
            box-shadow: 0 4px 16px rgba(255,182,193,0.08);
        }
        .btn-schedule:active { box-shadow: none; }

        /* ══ AR SCHEDULE FULLSCREEN OVERLAY ══ */
        #ar-schedule {
            position: fixed; inset: 0; z-index: 700;
            background: #000;
            display: none;
        }
        #ar-schedule.visible {
            display: block;
        }

        /* Top status bar */
        #ar-status-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 800;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(to bottom, rgba(13,0,20,0.9) 0%, transparent 100%);
            pointer-events: none;
        }
        #ar-status-text {
            color: rgba(255,182,193,0.95); font-size: 13px; font-weight: 700;
            letter-spacing: 0.3px; pointer-events: none;
            background: rgba(13,0,20,0.6); border: 1px solid rgba(255,182,193,0.25);
            border-radius: 20px; padding: 8px 18px; backdrop-filter: blur(6px);
        }
        #ar-close-btn {
            pointer-events: all;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(13,0,20,0.75); border: 1px solid rgba(255,182,193,0.3);
            color: #FFB6C1; font-size: 17px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(6px); flex-shrink: 0;
        }

        /* Marker hint — shown before marker detected */
        #ar-hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 800; width: 88%; max-width: 310px;
            background: rgba(13,0,20,0.88);
            border: 1px solid rgba(255,182,193,0.3);
            border-radius: 18px; padding: 18px 22px;
            text-align: center; backdrop-filter: blur(8px);
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #ar-hint.hidden { opacity: 0; }
        #ar-hint-title { color: #FFB6C1; font-size: 15px; font-weight: 700; margin-bottom: 7px; }
        #ar-hint-body  { color: rgba(255,182,193,0.75); font-size: 12px; line-height: 1.7; }

        /* Bottom event dot navigator */
        #ar-dots {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            z-index: 800; display: flex; gap: 9px; align-items: center;
            pointer-events: none;
        }
        .ev-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,182,193,0.25);
            transition: all 0.4s ease;
        }
        .ev-dot.on {
            background: #FF6B9D;
            transform: scale(1.6);
            box-shadow: 0 0 8px rgba(255,107,157,0.9);
        }
    </style>
</head>
<body>

<!-- ══ LOADING ══ -->
<div id="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-text">Loading your invitation…</div>
</div>

<!-- ══ PETALS ══ -->
<div class="petals-bg" id="petals"></div>

<!-- ══════════════════════════════════════════
     LANDING PAGE
══════════════════════════════════════════ -->
<div id="landing">

    <!-- Invite card -->
    <div class="invite-card">
        <div class="eyebrow">You're invited to</div>
        <div class="names">Saira</div>
        <span class="amp">&amp;</span>
        <div class="names">Rahul</div>
        <div class="divider"></div>
        <div class="detail">📅 &nbsp;Saturday, 14 February 2026</div>
        <div class="detail">📍 &nbsp;VIT Vellore, Tamil Nadu</div>
        <div class="detail">⏰ &nbsp;Ceremony at 10:00 AM</div>
        <span class="ring">💍</span>
    </div>

    <!-- Live countdown -->
    <div class="countdown-wrap">
        <div class="countdown-label">Wedding begins in</div>
        <div class="countdown-boxes">
            <div class="cd-box">
                <span class="cd-num" id="cd-d">--</span>
                <span class="cd-unit">DAYS</span>
            </div>
            <div class="cd-box">
                <span class="cd-num" id="cd-h">--</span>
                <span class="cd-unit">HRS</span>
            </div>
            <div class="cd-box">
                <span class="cd-num" id="cd-m">--</span>
                <span class="cd-unit">MIN</span>
            </div>
            <div class="cd-box">
                <span class="cd-num" id="cd-s">--</span>
                <span class="cd-unit">SEC</span>
            </div>
        </div>
    </div>

    <!-- 3 action buttons -->
    <div class="btn-group">

        <!-- Button 1: AR Invitation -->
        <button class="btn btn-invite" onclick="openARInvitation()">
            <span style="font-size:20px">📸</span>
            <span>Open AR Invitation</span>
        </button>

        <!-- Button 2: AR Navigation -->
        <button class="btn btn-nav" onclick="openARNavigation()">
            <span style="font-size:20px">🧭</span>
            <span>AR Navigate to Venue</span>
        </button>

        <!-- Button 3: AR Event Schedule -->
        <button class="btn btn-schedule" onclick="openARSchedule()">
            <span style="font-size:20px">📋</span>
            <span>AR Event Schedule</span>
        </button>

    </div>
</div>

</body>
</html>
