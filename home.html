<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saira's Wedding 💍</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { font-family: 'Georgia', serif; background: #0D0014; color: #fff; overflow-x: hidden; }

        #loading-screen {
            position: fixed; inset: 0; z-index: 9999; background: #0D0014;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            transition: opacity 0.8s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-ring {
            width: 64px; height: 64px;
            border: 3px solid rgba(255,182,193,0.2);
            border-top-color: #FF6B9D; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: rgba(255,182,193,0.7); font-size: 15px; letter-spacing: 2px; }

        .petals-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .petal { position: absolute; border-radius: 50%; opacity: 0.6; animation: fall linear infinite; }
        @keyframes fall {
            0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        #landing {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 28px 20px 100px;
            background: radial-gradient(ellipse at top, #1a0028 0%, #0D0014 70%);
            overflow-y: auto;
        }

        .invite-card {
            position: relative; z-index: 2;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,182,193,0.3);
            border-radius: 22px; padding: 36px 28px;
            max-width: 370px; width: 100%;
            text-align: center; backdrop-filter: blur(12px);
            animation: fadeUp 1s ease both;
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(32px);} to{opacity:1;transform:translateY(0);} }
        .eyebrow { color: rgba(255,182,193,0.7); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; }
        .names   { color: #FFB6C1; font-size: 36px; font-weight: 700; line-height: 1.1; }
        .amp     { color: rgba(255,182,193,0.45); font-size: 22px; margin: 6px 0; display: block; }
        .divider { width: 56px; height: 1px; background: rgba(255,182,193,0.3); margin: 18px auto; }
        .detail  { color: #fff; font-size: 14px; margin: 5px 0; }
        .ring    { font-size: 50px; margin: 20px 0 0; display: block; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.09);} }

        .countdown-wrap {
            position: relative; z-index: 2;
            width: 100%; max-width: 370px; margin-top: 16px;
            background: rgba(255,182,193,0.06);
            border: 1px solid rgba(255,182,193,0.2);
            border-radius: 16px; padding: 14px 10px; text-align: center;
            animation: fadeUp 1.1s ease both;
        }
        .countdown-label { color: rgba(255,182,193,0.55); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .countdown-boxes { display: flex; justify-content: center; gap: 8px; }
        .cd-box { display: flex; flex-direction: column; align-items: center; background: rgba(255,59,127,0.13); border: 1px solid rgba(255,59,127,0.32); border-radius: 10px; padding: 9px 12px; min-width: 56px; }
        .cd-num  { color: #FFB6C1; font-size: 26px; font-weight: 700; font-family: monospace; line-height: 1; }
        .cd-unit { color: rgba(255,182,193,0.45); font-size: 9px; letter-spacing: 1px; margin-top: 4px; }

        .btn-group {
            position: relative; z-index: 2;
            width: 100%; max-width: 370px; margin-top: 16px;
            display: flex; flex-direction: column; gap: 11px;
            animation: fadeUp 1.2s ease both;
        }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 15px 20px; border-radius: 14px; border: none; cursor: pointer;
            font-size: 15px; font-weight: 700; font-family: 'Georgia', serif;
            transition: transform 0.15s ease;
        }
        .btn:active { transform: scale(0.96); }
        .btn-invite   { background: linear-gradient(135deg,#FF3B7F,#c0255a); color:#fff; box-shadow:0 4px 20px rgba(255,59,127,0.35); }
        .btn-nav      { background: rgba(0,200,255,0.12); color:#00C8FF; border:1px solid rgba(0,200,255,0.4); }
        .btn-schedule { background: rgba(255,215,0,0.12); color:#FFD700; border:1px solid rgba(255,215,0,0.4); }

        /* ══ FULLSCREEN IFRAME OVERLAY ══
           The AR scene lives in ar-scene.html loaded into this iframe.
           The iframe is created only when the button is tapped —
           so the camera never starts on landing page load.
           Closed by removing the iframe from the DOM entirely,
           which also stops the camera stream.
        ══ */
        #ar-fullscreen {
            display: none;
            position: fixed; inset: 0; z-index: 900;
            background: #000;
        }
        #ar-fullscreen.open { display: block; }

        #ar-iframe {
            width: 100%; height: 100%;
            border: none; display: block;
            background: #000;
        }

        /* Close button sits over the iframe */
        #ar-close-btn {
            position: fixed; top: 16px; right: 16px; z-index: 1000;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(13,0,20,0.85); border: 1px solid rgba(255,182,193,0.4);
            color: #FFB6C1; font-size: 18px; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        #ar-close-btn.open { display: flex; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-text">Loading your invitation…</div>
</div>

<div class="petals-bg" id="petals"></div>

<div id="landing">
    <div class="invite-card">
        <div class="eyebrow">You're invited to</div>
        <div class="names">Saira</div>
        <span class="amp">&amp;</span>
        <div class="names">Rahul</div>
        <div class="divider"></div>
        <div class="detail">📅 &nbsp;Saturday, 14 February 2026</div>
        <div class="detail">📍 &nbsp;VIT Vellore, Tamil Nadu</div>
        <div class="detail">⏰ &nbsp;Ceremony at 10:00 AM</div>
        <span class="ring">💍</span>
    </div>

    <div class="countdown-wrap">
        <div class="countdown-label">Wedding begins in</div>
        <div class="countdown-boxes">
            <div class="cd-box"><span class="cd-num" id="cd-d">--</span><span class="cd-unit">DAYS</span></div>
            <div class="cd-box"><span class="cd-num" id="cd-h">--</span><span class="cd-unit">HRS</span></div>
            <div class="cd-box"><span class="cd-num" id="cd-m">--</span><span class="cd-unit">MIN</span></div>
            <div class="cd-box"><span class="cd-num" id="cd-s">--</span><span class="cd-unit">SEC</span></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-invite"   onclick="openARInvitation()">
            <span style="font-size:20px">📸</span><span>Open AR Invitation</span>
        </button>
        <button class="btn btn-nav"      onclick="openARNavigation()">
            <span style="font-size:20px">🧭</span><span>AR Navigate to Venue</span>
        </button>
        <button class="btn btn-schedule" onclick="openARSchedule()">
            <span style="font-size:20px">✨</span><span>AR Event Schedule</span>
        </button>
    </div>
</div>

<!-- Fullscreen container for the AR iframe -->
<div id="ar-fullscreen">
    <!-- iframe injected here by JS when button tapped -->
</div>

<!-- Close button floats over everything -->
<button id="ar-close-btn" onclick="closeAR()">✕</button>

<script>
    /* PETALS */
    (function(){
        const colors=['#FF6B9D','#FFB3C8','#FF8FAB','#FFC8D8','#FFD6E7'];
        const w=document.getElementById('petals');
        for(let i=0;i<28;i++){
            const p=document.createElement('div'); p.className='petal';
            const s=8+Math.random()*15;
            p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}vw;top:-${s}px;background:${colors[i%colors.length]};animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*7}s;`;
            w.appendChild(p);
        }
    })();

    window.addEventListener('load',()=>setTimeout(()=>
        document.getElementById('loading-screen').classList.add('hidden'),900));

    /* COUNTDOWN */
    const WT=new Date('2026-02-14T10:00:00+05:30').getTime();
    function pad(n){return String(n).padStart(2,'0');}
    function tick(){
        const d=WT-Date.now(); if(d<=0) return;
        const s=Math.floor(d/1000);
        document.getElementById('cd-d').textContent=pad(Math.floor(s/86400));
        document.getElementById('cd-h').textContent=pad(Math.floor((s%86400)/3600));
        document.getElementById('cd-m').textContent=pad(Math.floor((s%3600)/60));
        document.getElementById('cd-s').textContent=pad(s%60);
    }
    tick(); setInterval(tick,1000);

    /* ── OPEN / CLOSE AR ──
       Creates a fresh iframe pointing to ar-scene.html.
       AR.js starts camera only inside that iframe context.
       Closing removes the iframe — stops camera completely.
    ── */
    function openAR(src) {
        const container = document.getElementById('ar-fullscreen');
        // Remove any existing iframe first
        container.innerHTML = '';
        // Create fresh iframe
        const iframe = document.createElement('iframe');
        iframe.id = 'ar-iframe';
        iframe.src = src;
        iframe.allow = 'camera; microphone; gyroscope; accelerometer';
        iframe.setAttribute('allowfullscreen', '');
        container.appendChild(iframe);
        container.classList.add('open');
        document.getElementById('ar-close-btn').classList.add('open');
        // Prevent landing page scroll while AR is open
        document.body.style.overflow = 'hidden';
    }

    function closeAR() {
        const container = document.getElementById('ar-fullscreen');
        // Remove iframe completely — stops camera stream
        container.innerHTML = '';
        container.classList.remove('open');
        document.getElementById('ar-close-btn').classList.remove('open');
        document.body.style.overflow = '';
    }

    function openARInvitation() {
        openAR('index.html'); // your existing invitation page
    }

    function openARNavigation() {
        window.open('https://www.google.com/maps/dir/?api=1&destination=12.9692,79.1559&travelmode=walking','_blank');
    }

    function openARSchedule() {
        openAR('ar-scene.html'); // the AR schedule scene
    }
</script>
</body>
</html>
