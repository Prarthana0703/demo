<!DOCTYPE html>
<html>
<head>
    <title>Premium AR Wedding Invite 💍</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <!-- ✨ SPARKLES -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-particle-system-component@1.0.11/dist/aframe-particle-system-component.min.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 🎵 MUSIC (YOUR FILE) -->
    <a-entity id="music"></a-entity>

    <!-- 💡 LIGHT -->
    <a-light type="ambient" intensity="1.4" color="#FFDAB9"></a-light>
    <a-light type="point" position="0 3 2" intensity="1.5" color="#FFD700"></a-light>

    <a-marker preset="hiro">

        <!-- ✨ SPARKLE EFFECT -->
        <a-entity 
            particle-system="preset: dust; color: #FFD700, #FFF; particleCount: 200; size: 1"
            position="0 1 0">
        </a-entity>

        <!-- 💖 PREMIUM TITLE -->
        <a-text 
            value="✨ Rahul ❤️ Saira ✨"
            position="0 0 -1.5"
            align="center"
            color="#FFD700"
            width="4"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            material="emissive:#FFD700; emissiveIntensity:3"
            look-at="[camera]"
            animation="property: scale; to:1.15 1.15 1.15; dir:alternate; dur:1500; loop:true">
        </a-text>

        <!-- 🎯 CLEAN DETECTED NAME -->
        <a-text 
            id="detected-name"
            value=""
            position="0 0 2"
            align="center"
            color="#FF69B4"
            width="2.5"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            material="emissive:#FF69B4; emissiveIntensity:1.5"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -1.2 0.5"
            scale="1.5 1.5 2"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💑 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 -0.25 0.2"
            scale="0.6 0.6 0.6"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 PETALS (VERTICAL FROM TOP) -->

        <a-plane src="rose_petal.png"
            position="-0.5 3 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:-0.5 -1 0; dur:3000; loop:true; easing:linear"
            animation__rotate="property: rotation; to:360 360 360; dur:2000; loop:true">
        </a-plane>

        <a-plane src="rose_petal.png"
            position="0.5 3.5 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:0.5 -1 0; dur:3200; loop:true; easing:linear"
            animation__rotate="property: rotation; to:360 360 360; dur:2200; loop:true">
        </a-plane>

        <a-plane src="rose_petal.png"
            position="0 4 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:0 -1 0; dur:3500; loop:true; easing:linear"
            animation__rotate="property: rotation; to:360 360 360; dur:2500; loop:true">
        </a-plane>

        <!-- 💬 MESSAGE -->
        <a-text 
            id="personal-msg"
            value="Scanning name..."
            position="0 -1.3 2"
            align="center"
            color="#FFF5CC"
            width="3.5"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

// 🎵 FIX MUSIC (YOUR FILE)
window.addEventListener("click", () => {
    const music = document.querySelector("#music");

    if (!music.components.sound) {
        music.setAttribute("sound", {
            src: "url(wedding-music.mp3)",
            autoplay: true,
            loop: true,
            volume: 0.7
        });
    } else {
        music.components.sound.playSound();
    }
});

// 🔊 VOICE
function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(msg);
}

// ✅ CLEAN NAME DETECTION
function extractName(text) {
    text = text.replace(/[^a-zA-Z ]/g, " ").trim();
    let words = text.split(/\s+/);

    const ignore = ["hiro","marker","welcome","wedding","rahul","saira","weds"];

    let filtered = words.filter(w =>
        w.length >= 3 &&
        /^[A-Z][a-z]+$/.test(w) &&
        !ignore.includes(w.toLowerCase())
    );

    return filtered[0] || "";
}

// 🔍 OCR LOOP
let lastName = "";
let processing = false;

async function scan() {

    if (processing) return;
    processing = true;

    const video = document.querySelector("video");

    if (!video || video.readyState !== 4) {
        processing = false;
        requestAnimationFrame(scan);
        return;
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const img = canvas.toDataURL("image/png");

    const result = await Tesseract.recognize(img, 'eng');
    const name = extractName(result.data.text);

    if (name && name !== lastName) {
        lastName = name;

        document.querySelector("#detected-name").setAttribute("value", name);

        document.querySelector("#personal-msg").setAttribute("value",
`Dear ${name},
With great joy in our hearts, we invite you to celebrate our special day 💍
Your presence will make our celebration even more memorable 💐`);

        speak(`Dear ${name}, you are invited to Rahul weds Saira wedding.`);
    }

    processing = false;
    requestAnimationFrame(scan);
}

scan();

</script>

</body>
</html>
