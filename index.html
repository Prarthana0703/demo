<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- LIGHT -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 3 1"></a-light>

    <a-marker preset="hiro">

        <!-- 💖 TITLE (TOP) -->
        <a-text 
            value="Rahul ❤️ Saira"
            position="0 1.8 0"
            align="center"
            color="#FFD700"
            scale="1.5 1.5 1.5"
            look-at="[camera]">
        </a-text>

        <!-- 💍 WEDS -->
        <a-text 
            value="Weds"
            position="0 1.5 0"
            align="center"
            color="white"
            scale="1.2 1.2 1.2"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -0.8 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 COUPLE (TEMP WORKING MODEL) -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 -0.2 0"
            scale="0.8 0.8 0.8"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 PETALS -->
        <a-plane 
            src="rose_petal.png"
            position="-0.5 -0.3 0"
            width="0.25" height="0.25"
            material="transparent: true; side: double"
            look-at="[camera]"
            animation="property: position; to: -0.5 -1 0; dur: 4000; loop: true">
        </a-plane>

        <a-plane 
            src="rose_petal.png"
            position="0.5 2.3 0"
            width="0.25" height="0.25"
            material="transparent: true; side: double"
            look-at="[camera]"
            animation="property: position; to: 0.5 -1 0; dur: 5000; loop: true">
        </a-plane>

        <!-- 💬 MESSAGE (BOTTOM) -->
        <a-text 
            value="With great joy in our hearts,\nwe invite you to celebrate our special day.\nYour presence will make it memorable 💐"
            position="0 -0.3 0.3"
            align="center"
            color="gold"
            width="3"
            scale="0.8 0.8 0.8"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
