<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin: 0; overflow: hidden; }
    video, canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>

<body>

<!-- Camera -->
<video id="camera" autoplay playsinline></video>

<!-- AR Canvas -->
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// 📍 DESTINATION (CHANGE THIS)
const DEST = { lat: 12.9716, lng: 77.5946 };

// THREE.js setup
let scene = new THREE.Scene();
let camera3D = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);

// Arrow (simple cone)
let arrow = new THREE.Mesh(
  new THREE.ConeGeometry(0.3, 1, 32),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
arrow.position.set(0, -1, -3);
arrow.rotation.x = Math.PI;
scene.add(arrow);

// Camera feed
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
  document.getElementById("camera").srcObject = stream;
})
.catch(err => alert("Camera not working"));

// Get location
navigator.geolocation.watchPosition(pos => {
  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  updateArrow(lat, lng);
}, err => alert(err.message), { enableHighAccuracy: true });

// Rotate arrow toward destination
function updateArrow(lat, lng) {
  let dx = DEST.lng - lng;
  let dz = DEST.lat - lat;

  let angle = Math.atan2(dx, dz);
  arrow.rotation.y = angle;
}

// Render loop
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera3D);
}
animate();

</script>

</body>
</html>
