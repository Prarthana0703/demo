<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene</title>

    <!-- AFRAME -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- LOOK AT -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <script>
        function speakMessage() {
            let msg = new SpeechSynthesisUtterance(
                "Rahul weds Saira. With great joy in our hearts, we invite you to celebrate our special day."
            );
            window.speechSynthesis.speak(msg);
        }
    </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- LIGHT -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 3 1"></a-light>

    <a-marker preset="hiro" onmarkerfound="speakMessage()">

        <!-- 💖 TITLE -->
        <a-text 
            value="Rahul ❤️ Saira"
            position="0 1.8 0"
            align="center"
            color="#FFD700"
            width="6"
            look-at="[camera]">
        </a-text>

        <!-- 💍 WEDS -->
        <a-text 
            value="Weds"
            position="0 1.5 0"
            align="center"
            color="white"
            width="4"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -0.8 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💑 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 0 0.1"
            scale="0.5 0.5 0.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 PETALS (SIMPLE SAFE) -->
        <a-plane 
            src="rose_petal.png"
            position="0 3 0"
            width="0.25" height="0.25"
            material="transparent:true"
            look-at="[camera]"
            animation="property: position; to: 0 -1 0; dur: 4000; loop: true">
        </a-plane>

        <!-- 💬 MESSAGE -->
        <a-text 
            value="With great joy in our hearts,\nwe invite you to celebrate our special day."
            position="0 -0.3 0.3"
            align="center"
            color="gold"
            width="3"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
