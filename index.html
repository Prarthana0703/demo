<!DOCTYPE html>
<html>
<head>
    <title>AR Cinematic Wedding</title>

    <!-- AFRAME -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <!-- LOOK AT -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- PARTICLES -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-particle-system-component@1.0.11/dist/aframe-particle-system-component.min.js"></script>

    <!-- VOICE -->
    <script>
        function speakMessage() {
            let msg = new SpeechSynthesisUtterance(
                "Rahul weds Saira. With great joy in our hearts, we invite you to celebrate our special day. Your presence will make it even more memorable."
            );
            msg.rate = 0.9;
            msg.pitch = 1;
            msg.volume = 1;
            window.speechSynthesis.speak(msg);
        }
    </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 🎵 MUSIC -->
    <a-entity sound="src: url(https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0c0f.mp3); autoplay: true; loop: true; volume: 0.6"></a-entity>

    <!-- 💡 CINEMATIC LIGHT -->
    <a-light type="ambient" intensity="1.4" color="#FFDAB9"></a-light>
    <a-light type="point" position="0 3 2" intensity="1.5" color="#FFD700"></a-light>

    <a-marker preset="hiro" onmarkerfound="speakMessage()">

        <!-- ✨ SPARKLE PARTICLES -->
        <a-entity 
            particle-system="preset: dust; color: #FFD700, #FFF; particleCount: 200; size: 1"
            position="0 1 0">
        </a-entity>

        <!-- 💖 TITLE -->
        <a-text 
            value="Rahul ❤️ Saira"
            position="0 1.8 0"
            align="center"
            color="#FFD700"
            width="6"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            material="emissive:#FFD700; emissiveIntensity:3"
            look-at="[camera]"
            animation="property: scale; to:1.3 1.3 1.3; dir:alternate; dur:1200; loop:true">
        </a-text>

        <!-- 💍 WEDS -->
        <a-text 
            value="✨ Weds ✨"
            position="0 1.5 0"
            align="center"
            color="#FFF8DC"
            width="4"
            shader="msdf"
            font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
            material="emissive:#FFD700; emissiveIntensity:2"
            look-at="[camera]"
            animation="property: scale; to:1.15 1.15 1.15; dir:alternate; dur:1000; loop:true">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -0.8 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0"
            animation="property: rotation; to:-90 360 0; dur:15000; loop:true; easing:linear">
        </a-entity>

        <!-- 💑 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 0 0.1"
            scale="0.5 0.5 0.5"
            rotation="-90 0 0"
            animation="property: position; to:0 0.05 0.1; dir:alternate; dur:2000; loop:true">
        </a-entity>

        <!-- 🌸 PETALS (CINEMATIC FALL) -->

        <a-plane src="rose_petal.png"
            position="-0.5 3 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:-0.5 -1 0; dur:3500; loop:true"
            animation__sway="property: position; dir:alternate; to:-0.2 1 0; dur:2000; loop:true"
            animation__rotate="property: rotation; to:360 360 360; dur:2500; loop:true">
        </a-plane>

        <a-plane src="rose_petal.png"
            position="0.5 3.5 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:0.5 -1 0; dur:4000; loop:true"
            animation__sway="property: position; dir:alternate; to:0.2 1 0; dur:2200; loop:true"
            animation__rotate="property: rotation; to:360 360 360; dur:3000; loop:true">
        </a-plane>

        <!-- 💬 MESSAGE -->
        <a-text 
            value="With great joy in our hearts,\nwe invite you to celebrate our special day.\nYour presence will make it even more memorable 💐"
            position="0 -0.3 0.3"
            align="center"
            color="#FFD700"
            width="3"
            scale="0.9 0.9 0.9"
            look-at="[camera]"
            animation="property: opacity; from:0; to:1; dur:2000">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
