<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 🎵 MUSIC ENTITY -->
    <a-entity id="music" sound="autoplay:false"></a-entity>

    <!-- LIGHT -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 3 1"></a-light>

    <a-marker preset="hiro">

        <!-- 💖 TITLE -->
        <a-text value="Rahul ❤️ Saira"
            position="0 1.8 0"
            align="center"
            color="#FFD700"
            scale="1.5 1.5 1.5"
            look-at="[camera]">
        </a-text>

        <!-- 💍 WEDS -->
        <a-text value="Weds"
            position="0 1.5 0"
            align="center"
            color="white"
            scale="1.2 1.2 1.2"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -0.8 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 0 0.2"
            scale="0.5 0.5 0.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 PETALS (RICH SHOWER) -->
        <a-plane src="rose_petal.png" position="-0.5 3 0" width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:-0.5 -1 0; dur:4000; loop:true"
            animation__rot="property: rotation; to:360 360 360; dur:3000; loop:true">
        </a-plane>

        <a-plane src="rose_petal.png" position="0.5 3.5 0" width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:0.5 -1 0; dur:4500; loop:true"
            animation__rot="property: rotation; to:360 360 360; dur:3500; loop:true">
        </a-plane>

        <a-plane src="rose_petal.png" position="0 4 0" width="0.22" height="0.22"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation__fall="property: position; to:0 -1 0; dur:3500; loop:true"
            animation__rot="property: rotation; to:360 360 360; dur:2400; loop:true">
        </a-plane>

        <!-- ✨ SPARKLES (NEW) -->
        <a-sphere radius="0.03" color="#FFD700" position="-0.3 1.5 0.2"
            animation="property: opacity; from:0; to:1; dur:1000; loop:true; dir:alternate"
            animation__float="property: position; to:-0.3 1.8 0.2; dur:2000; loop:true; dir:alternate">
        </a-sphere>

        <a-sphere radius="0.02" color="#FFFACD" position="0.3 1.3 0.2"
            animation="property: opacity; from:0; to:1; dur:800; loop:true; dir:alternate"
            animation__float="property: position; to:0.3 1.6 0.2; dur:1800; loop:true; dir:alternate">
        </a-sphere>

        <a-sphere radius="0.025" color="#FFD700" position="0 1.7 0.2"
            animation="property: opacity; from:0; to:1; dur:1200; loop:true; dir:alternate"
            animation__float="property: position; to:0 2 0.2; dur:2200; loop:true; dir:alternate">
        </a-sphere>

        <!-- 💬 PERSONAL MESSAGE -->
        <a-text id="personal-msg"
            value="Welcome 💐"
            position="0 -0.1 0.3"
            align="center"
            color="gold"
            width="3"
            scale="0.8 0.8 0.8"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<!-- 🎤 SCRIPT -->
<script>

let lastName = "";
let processing = false;
let hasSpoken = false;

// 🎵 MUSIC
window.addEventListener("click", () => {
    const music = document.querySelector("#music");

    music.setAttribute("sound", {
        src: "url(https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0c0f.mp3)",
        autoplay: true,
        loop: true,
        volume: 0.6
    });
});

// 🔊 VOICE
function speak(text) {
    if (hasSpoken) return;
    hasSpoken = true;

    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 0.9;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
}

// ✅ NAME FILTER
function extractName(text) {

    text = text.replace(/[^a-zA-Z ]/g, " ");
    let words = text.split(/\s+/);

    let valid = words.filter(w =>
        w.length >= 3 &&
        w.length <= 10 &&
        /^[A-Z][a-z]+$/.test(w)
    );

    return valid[0] || "";
}

// 🔍 OCR LOOP
async function scan() {

    if (processing) return;
    processing = true;

    const video = document.querySelector("video");

    if (!video || video.readyState !== 4) {
        processing = false;
        requestAnimationFrame(scan);
        return;
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const w = video.videoWidth;
    const h = video.videoHeight;

    canvas.width = w * 0.5;
    canvas.height = h * 0.3;

    ctx.drawImage(video, w*0.25, h*0.35, w*0.5, h*0.3, 0, 0, canvas.width, canvas.height);

    const img = canvas.toDataURL("image/png");

    const result = await Tesseract.recognize(img, 'eng');

    let name = extractName(result.data.text);

    if (name && name !== lastName) {

        lastName = name;

        let fullMsg = `Dear ${name}. With great joy in our hearts, we invite you to celebrate our special day. Your presence will make our celebration even more memorable.`;

        document.querySelector("#personal-msg")
            .setAttribute("value",
`Dear ${name},
With great joy in our hearts, we invite you 💍
Your presence will make our celebration even more memorable 💐`);

        speak(fullMsg);
    }

    processing = false;
    requestAnimationFrame(scan);
}

scan();

</script>

</body>
</html>
