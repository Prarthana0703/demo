<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Invitation ✨</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;">

    <a-assets>
        <img id="hallEnv" src="Back.png">
        <img id="archBoard" src="Display.png">
        <img id="wood" src="texture.jpg">
        <img id="g_bride" src="Bride.png">
        <img id="g_barat" src="Barat.png">
        <img id="g_sanget" src="Sangeet.png">
        
        <a-mixin id="sparkle" geometry="primitive: sphere; radius: 0.015" material="shader: flat; transparent: true; opacity: 0.8"></a-mixin>
        <a-mixin id="functionTitle" align="center" color="#5C4033" width="2.2" font="serif"></a-mixin>
        <a-mixin id="timeSub" align="center" color="#8B4513" width="1.6"></a-mixin>
    </a-assets>

    <a-marker preset="hiro">

        <a-circle rotation="-90 0 0" radius="1.3" position="0 0.01 0" material="src: #wood; roughness: 1"></a-circle>

        <a-entity 
            geometry="primitive: cylinder; radius: 1.6; height: 2; thetaStart: 110; thetaLength: 140; openEnded: true"
            material="src: #hallEnv; side: back; shader: flat"
            position="0 1 -0.8">
        </a-entity>

        <a-entity position="0 0.9 -0.4">

            <a-entity position="-0.4 0 0" rotation="0 8 0">

<a-plane src="#archBoard" width="1" height="1.7" material="transparent: true; alphaTest: 0.5; shader: flat"></a-plane>

<a-entity position="0 0 0.1">
    <a-text value="THE WEDDING SCHEDULE" position="0 0.7 0" align="center" color="#000000" width="2" font="serif"></a-text>

    <a-entity position="-0.3 0.4 0">
        <a-text value="10:30 AM" color="#000000" width="2" align="left"></a-text>
        <a-text value="HALDI CEREMONY" position="0 -0.12 0.01" color="#000000" width="2" align="left" font="serif"></a-text>
    </a-entity>

    <a-entity position="-0.3 0.1 0">
        <a-text value="04:00 PM" color="#000000" width="2" align="left"></a-text>
        <a-text value="BARAAT & SWAGAT" position="0 -0.12 0.01" color="#000000" width="2" align="left" font="serif"></a-text>
    </a-entity>

    <a-entity position="-0.3 -0.2 0">
        <a-text value="06:30 PM" color="#000000" width="2" align="left"></a-text>
        <a-text value="SHUBH VIVAH" position="0 -0.12 0.01" color="#000000" width="2" align="left" font="serif"></a-text>
    </a-entity>

    <a-entity position="-0.3 -0.5 0">
        <a-text value="08:30 PM" color="#000000" width="2" align="left"></a-text>
        <a-text value="DINNER & SANGEET" position="0 -0.12 0.01" color="#000000" width="2" align="left" font="serif"></a-text>
    </a-entity>
</a-entity>

        <a-entity id="sparkle-layer">
            <a-entity mixin="sparkle" color="#FFD700" position="-0.4 1.2 0.3" 
                animation="property: position; to: -0.4 1.5 0.3; dur: 3000; dir: alternate; loop: true">
            </a-entity>
            <a-entity mixin="sparkle" color="#FFFFFF" position="0.5 0.9 0.4" 
                animation="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1200; dir: alternate; loop: true">
            </a-entity>
        </a-entity>

        <a-light type="ambient" intensity="1.4" color="#FFF5CC"></a-light>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

</body>
</html>
