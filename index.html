<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene - Final</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

<canvas id="overlay"></canvas>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 3 1"></a-light>

    <a-marker preset="hiro">

        <!-- 💖 TITLE -->
        <a-text 
            value="Rahul ❤️ Saira"
            position="0 1.2 0"
            align="center"
            color="#FFD700"
            scale="1.2 1.2 1.2"
            look-at="[camera]">
        </a-text>

        <!-- 🎯 DETECTED NAME -->
        <a-text 
            id="detected-name"
            value=""
            position="0 1.8 0"
            align="center"
            color="#00FF00"
            width="2"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -1.2 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 COUPLE (SLIGHT ROTATION ANIMATION) -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 -0.2 -0.5"
            scale="0.6 0.6 0.6"
            rotation="-90 0 0"

            animation__tilt="
                property: rotation;
                dir: alternate;
                dur: 2000;
                loop: true;
                to: -80 0 0">
        </a-entity>

        <!-- 🌸 MANY ROSE PETALS -->

        <!-- Row 1 -->
        <a-plane src="rose_petal.png" position="-0.8 2.5 2.75" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: -0.8 -1 0; dur: 4000; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3000; loop: true"></a-plane>

        <a-plane src="rose_petal.png" position="-0.4 2.8 2.5" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: -0.4 -1 0; dur: 4500; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3200; loop: true"></a-plane>

        <a-plane src="rose_petal.png" position="0 2.6 2.3" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: 0 -1 0; dur: 4200; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 2800; loop: true"></a-plane>

        <a-plane src="rose_petal.png" position="0.4 2.9 2.20" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: 0.4 -1 0; dur: 4800; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3500; loop: true"></a-plane>

        <a-plane src="rose_petal.png" position="0.8 2.7 2.66" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: 0.8 -1 0; dur: 4600; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3000; loop: true"></a-plane>

        <!-- Row 2 -->
        <a-plane src="rose_petal.png" position="-0.6 3.2 2.99" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: -0.6 -1 0; dur: 5000; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3500; loop: true"></a-plane>

        <a-plane src="rose_petal.png" position="0.6 3.1 2.12" width="0.2" height="0.2"
            material="transparent:true;side:double" look-at="[camera]"
            animation="property: position; to: 0.6 -1 0; dur: 5200; loop: true"
            animation__rot="property: rotation; to: 360 360 360; dur: 3300; loop: true"></a-plane>

        <!-- 💬 MESSAGE -->
        <a-text 
            id="personal-msg"
            value="Scanning name..."
            position="0 -1.5 0.3"
            align="center"
            color="gold"
            width="3"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
let lastName = "";
let processing = false;

function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(msg);
}

function extractFullName(text) {
    text = text.replace(/[^a-zA-Z ]/g, "").trim();
    let words = text.split(/\s+/);

    const ignore = ["wedding","invitation","welcome","dear","mr","mrs"];

    let filtered = words.filter(w =>
        w.length > 2 && !ignore.includes(w.toLowerCase())
    );

    if (filtered.length >= 2) return filtered[0] + " " + filtered[1];
    return filtered[0] || "";
}

function drawBox(bbox) {
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "lime";
    ctx.lineWidth = 3;

    ctx.strokeRect(bbox.x0, bbox.y0, bbox.x1 - bbox.x0, bbox.y1 - bbox.y0);
}

async function scan() {
    if (processing) return;
    processing = true;

    const video = document.querySelector("video");
    if (!video || video.readyState !== 4) {
        processing = false;
        requestAnimationFrame(scan);
        return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");

    ctx.drawImage(video, 0, 0);
    const img = canvas.toDataURL("image/png");

    const result = await Tesseract.recognize(img, 'eng');

    const text = result.data.text;
    const words = result.data.words;

    let name = extractFullName(text);

    if (name && name !== lastName) {
        lastName = name;

        document.querySelector("#personal-msg")
            .setAttribute("value",
            `Dear ${name},\nWelcome to our wedding 💐`);

        document.querySelector("#detected-name")
            .setAttribute("value", name);

        speak("Welcome " + name);

        if (words.length > 0) {
            drawBox(words[0].bbox);
        }
    }

    processing = false;
    requestAnimationFrame(scan);
}

scan();
</script>

</body>
</html>
