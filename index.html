<!DOCTYPE html>
<html>
<head>
    <title>Premium AR Wedding Invite 💍</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;"
onclick="document.querySelector('#music').components.sound.playSound()">

<canvas id="overlay"></canvas>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- 🎵 MUSIC -->
    <a-entity 
        id="music"
        sound="src: url(wedding-music.mp3); autoplay: false; loop: true; volume: 0.7">
    </a-entity>

    <!-- LIGHT -->
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="1 3 1"></a-light>

    <a-marker preset="hiro">

        <!-- 💖 TITLE -->
        <a-text 
            value="✨ Rahul WEDS Saira ✨"
            position="0 1.6 0.2"
            align="center"
            color="#FFD700"
            scale="1.3 1.3 1.3"
            look-at="[camera]">
        </a-text>

        <!-- 🎯 DETECTED NAME -->
        <a-text 
            id="detected-name"
            value=""
            position="0 1.9 0.2"
            align="center"
            color="#FF69B4"
            width="2"
            look-at="[camera]">
        </a-text>

        <!-- 💐 GATE -->
        <a-entity 
            gltf-model="wedding_gate-v1.glb"
            position="0 -1.2 0"
            scale="1.5 1.5 1.5"
            rotation="-90 0 0">
        </a-entity>

        <!-- 💍 COUPLE -->
        <a-entity 
            gltf-model="couple.glb"
            position="0 -0.25 0.2"
            scale="0.6 0.6 0.6"
            rotation="-90 0 0">
        </a-entity>

        <!-- 🌸 PETALS -->
        <a-plane src="rose_petal.png"
            position="-0.5 2 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation="property: position; to: -0.5 -1 0; dur: 4000; loop: true">
        </a-plane>

        <a-plane src="rose_petal.png"
            position="0.5 2.3 0"
            width="0.25" height="0.25"
            material="transparent:true;side:double"
            look-at="[camera]"
            animation="property: position; to: 0.5 -1 0; dur: 5000; loop: true">
        </a-plane>

        <!-- 💬 MESSAGE -->
        <a-text 
            id="personal-msg"
            value="Scanning name..."
            position="0 -1.3 0.5"
            align="center"
            color="#FFF5CC"
            width="3.5"
            look-at="[camera]">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
let lastName = "";
let processing = false;

// 🔊 Voice
function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(msg);
}

// ✅ CLEAN NAME DETECTION
function extractName(text) {

    text = text.replace(/[^a-zA-Z ]/g, " ").trim();

    let words = text.split(/\s+/);

    const ignore = [
        "hiro","marker","camera","welcome","wedding",
        "invitation","rahul","saira","weds"
    ];

    let filtered = words.filter(w =>
        w.length >= 3 &&
        /^[A-Z][a-z]+$/.test(w) &&
        !ignore.includes(w.toLowerCase())
    );

    return filtered[0] || "";
}

// 🔍 OCR LOOP
async function scan() {

    if (processing) return;
    processing = true;

    const video = document.querySelector("video");

    if (!video || video.readyState !== 4) {
        processing = false;
        requestAnimationFrame(scan);
        return;
    }

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const w = video.videoWidth;
    const h = video.videoHeight;

    const cropW = w * 0.5;
    const cropH = h * 0.3;

    const startX = (w - cropW) / 2;
    const startY = (h - cropH) / 2;

    canvas.width = cropW;
    canvas.height = cropH;

    ctx.drawImage(video, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

    const img = canvas.toDataURL("image/png");

    const result = await Tesseract.recognize(img, 'eng');

    const text = result.data.text;

    let name = extractName(text);

    if (name && name !== lastName) {

        lastName = name;

        // 💎 PREMIUM MESSAGE
        document.querySelector("#personal-msg")
            .setAttribute("value",
`Dear ${name},
With great joy in our hearts, we invite you to celebrate our special day 💍
Your presence will make our celebration even more memorable 💐`);

        document.querySelector("#detected-name")
            .setAttribute("value", name);

        speak(`Dear ${name}, you are warmly invited to our wedding celebration`);
    }

    processing = false;
    requestAnimationFrame(scan);
}

scan();
</script>

</body>
</html>
