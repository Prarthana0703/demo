<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding Scene</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs>

        <!-- Lighting -->
        <a-light type="ambient" intensity="1"></a-light>
        <a-light type="directional" position="1 2 1"></a-light>

        <a-marker preset="hiro">

            <!-- ❌ REMOVE GREEN PLANE -->

            <!-- ✅ CENTERED GATE -->
            <a-entity 
                gltf-model="wedding_gate-v1.glb"
                position="0 0.2 0"
                scale="1.5 1.5 1.5"
                rotation="-90 0 0">
            </a-entity>

            <!-- ✅ COUPLE (SCALE SAME ✅) -->
            <a-entity 
                gltf-model="model-v1-v2-v1 (1).glb"
                position="0 0.05 0"
                scale="0.6 0.6 0.6"
                rotation="-90 0 0">
            </a-entity>

            <!-- Text -->
            <a-text 
                value="Welcome to Our Wedding"
                position="0 1.2 0"
                align="center"
                color="gold">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
