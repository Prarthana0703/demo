<!DOCTYPE html>
<html>
<head>
    <title>The Celebration | Premium AR Timeline & Gallery ✨</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
        .loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #2c1a12; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: #f3e5ab; font-family: 'Georgia', serif;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="loading-screen" id="loader">
        <h2>✨ Unveiling 'The Celebration' ✨</h2>
        <p>Point your camera at the Hiro Marker</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true; logarithmicDepthBuffer: true;">
        
        <a-assets>
            <img id="velloreEnv" src="Back.png">
            <img id="glassPanel" src="Display.png">
            
            <img id="gallery_bride" src="bride.png">
            <img id="gallery_baraat" src="barat.png">
            <img id="gallery_sangeet" src="Sanget.png">
            <img id="gallery_reception" src="Reception.png">

            <a-mixin id="timelineHeader" font="serif" color="#B38B6D" align="center" width="2.2"></a-mixin>
            <a-mixin id="timelineEvent" font="serif" color="#5C4033" align="center" width="1.8"></a-mixin>
            <a-mixin id="timelineTime" font="serif" color="#8B4513" align="center" width="1.5"></a-mixin>
            <a-mixin id="photoFrame" geometry="primitive: plane; width: 0.35; height: 0.45" material="color: #ffffff; shader: standard; roughness: 0.2; metalness: 0.8"></a-mixin>
            
            <a-mixin id="sparkle" geometry="primitive: sphere; radius: 0.01" material="shader: flat; opacity: 0.8; transparent: true"></a-mixin>
        </a-assets>

        <a-marker preset="hiro">

            <a-circle rotation="-90 0 0" radius="1.3" position="0 0.01 0" material="color: #ffffff; roughness: 0.8; opacity: 0.6; transparent: true">
                <a-ring color="#B38B6D" radius-inner="1.28" radius-outer="1.3" position="0 0 0.01"></a-ring>
            </a-circle>

            <a-entity 
                geometry="primitive: cylinder; radius: 1.5; height: 1.8; thetaStart: 120; thetaLength: 120; openEnded: true"
                material="src: #velloreEnv; side: back; shader: flat; transparent: true; opacity: 0.9"
                position="0 0.9 -0.8" 
                rotation="0 0 0">
            </a-entity>

          <a-entity id="mainInterface" position="0 0 0" rotation="-90 0 0">
    
    <a-plane 
        src="#glassPanel"
        width="1.2" height="1.8" 
        position="-0.6 1 -0.1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5; shader: flat">
        
        <a-text value="THE CELEBRATION" position="0 0.7 0.15" mixin="timelineHeader" width="3.5"></a-text>

        <a-entity position="0 0.4 0.15">
            <a-text value="Ganesh Sthapana & Haldi" mixin="timelineEvent"></a-text>
            <a-text value="10:00 AM" position="0 -0.12 0" mixin="timelineTime"></a-text>
        </a-entity>

        <a-entity position="0 0.1 0.15">
            <a-text value="Baraat Swagat" mixin="timelineEvent"></a-text>
            <a-text value="04:00 PM" position="0 -0.12 0" mixin="timelineTime"></a-text>
        </a-entity>

        <a-entity position="0 -0.2 0.15">
            <a-text value="Jaimala Ceremony" mixin="timelineEvent"></a-text>
            <a-text value="05:00 PM" position="0 -0.12 0" mixin="timelineTime"></a-text>
        </a-entity>

        <a-entity position="0 -0.5 0.15">
            <a-text value="Pheras & Hast Melap" mixin="timelineEvent"></a-text>
            <a-text value="06:30 PM" position="0 -0.12 0" mixin="timelineTime"></a-text>
        </a-entity>
    </a-plane>

    <a-entity id="galleryCluster" position="0.6 1 -0.1">
        </a-entity>
</a-entity>
               
                    <a-entity position="-0.1 0.4 0.02" rotation="0 0 -5">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#gallery_bride" width="0.3" height="0.4" position="0 0 0.02"></a-plane>
                    </a-entity>
                    <a-entity position="0.1 0.1 0.04" rotation="0 0 3">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#gallery_baraat" width="0.3" height="0.4" position="0 0 0.02"></a-plane>
                    </a-entity>
                    <a-entity position="-0.05 -0.25 0.03" rotation="0 0 7">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#gallery_sangeet" width="0.3" height="0.4" position="0 0 0.02"></a-plane>
                    </a-entity>
                    <a-entity position="0.15 -0.4 0.01" rotation="0 0 -2">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#gallery_reception" width="0.3" height="0.4" position="0 0 0.02"></a-plane>
                    </a-entity>
                </a-entity>
            </a-entity>

            <a-entity id="sparkle-system">
                <a-entity mixin="sparkle" color="#FFD700" position="-0.6 1.2 0.2" 
                    animation="property: position; to: -0.6 1.6 0.2; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine"
                    animation__twinkle="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1000; dir: alternate; loop: true">
                </a-entity>
                <a-entity mixin="sparkle" color="#FFFFFF" position="0.7 0.8 -0.3" 
                    animation="property: position; to: 0.7 1.4 -0.3; dur: 4500; dir: alternate; loop: true; easing: easeInOutSine"
                    animation__fade="property: material.opacity; from: 0.1; to: 1; dur: 800; dir: alternate; loop: true">
                </a-entity>
                <a-entity mixin="sparkle" color="#FFD700" position="0.2 1.5 0.1" 
                    animation="property: position; to: -0.2 1.3 0.4; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
                </a-entity>
                <a-entity mixin="sparkle" color="#FFFFFF" position="-0.3 0.5 -0.6" 
                    animation="property: material.opacity; from: 0.2; to: 0.9; dur: 1200; dir: alternate; loop: true">
                </a-entity>
                <a-entity mixin="sparkle" color="#FFF5CC" position="0 1 -0.2" scale="1.5 1.5 1.5"
                    animation="property: scale; to: 0.5 0.5 0.5; dur: 2000; dir: alternate; loop: true">
                </a-entity>
            </a-entity>

            <a-light type="ambient" color="#FFF5CC" intensity="1.5"></a-light>
            <a-light type="directional" position="1 4 1" intensity="1.0" color="#FFD700"></a-light>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('camera-init', () => {
            document.getElementById('loader').style.display = 'none';
        });
    </script>
</body>
</html>
