<!DOCTYPE html>
<html>
  <head>
    <title>AR Wedding Gallery & Schedule</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=300">
        <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=300">
        <img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=300">
        <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=300">
        <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=300">
      </a-assets>

      <a-marker preset="hiro">
        
        <a-entity position="0 1.5 0">
          <a-plane src="#p1" position="-1.0 0 0" width="0.45" height="0.45"></a-plane>
          <a-plane src="#p2" position="-0.5 0 0" width="0.45" height="0.45"></a-plane>
          <a-plane src="#p3" position="0 0 0" width="0.45" height="0.45"></a-plane>
          <a-plane src="#p4" position="0.5 0 0" width="0.45" height="0.45"></a-plane>
          <a-plane src="#p5" position="1.0 0 0" width="0.45" height="0.45"></a-plane>
          
          <a-rect position="0 -0.3 0" width="2.2" height="0.02" color="#F4D03F"></a-rect>
        </a-entity>

        <a-entity position="0 0.2 0" rotation="-20 0 0">
          
          <a-text value="Event Schedule" color="#F4D03F" align="center" position="0 0.9 0" scale="0.7 0.7 0.7"></a-text>
          
          <a-entity position="0 0.6 0">
            <a-plane color="#111" opacity="0.8" width="2" height="0.3"></a-plane>
            <a-text value="10:00 AM - Welcome" color="#FFF" align="center" position="0 0 0.05" scale="0.4 0.4 0.4"></a-text>
          </a-entity>

          <a-entity position="0 0.25 0">
            <a-plane color="#111" opacity="0.8" width="2" height="0.3"></a-plane>
            <a-text value="12:00 PM - Wedding Ceremony" color="#FFF" align="center" position="0 0 0.05" scale="0.4 0.4 0.4"></a-text>
          </a-entity>

          <a-entity position="0 -0.1 0">
            <a-plane color="#111" opacity="0.8" width="2" height="0.3"></a-plane>
            <a-text value="02:00 PM - Reception Lunch" color="#FFF" align="center" position="0 0 0.05" scale="0.4 0.4 0.4"></a-text>
          </a-entity>
          
        </a-entity> 

      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
