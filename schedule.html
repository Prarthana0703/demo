<!DOCTYPE html>
<html>
  <head>
    <title>Premium AR Wedding Invitation</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;">
      
      <a-assets>
        <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500">
        <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=500">
        <img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=500">
        <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=500">
        <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500">

        <a-mixin id="photo-frame" geometry="primitive: plane; width: 0.52; height: 0.52;" material="color: #FFF; shader: standard; emissive: #FFD700; emissiveIntensity: 0.2; roughness: 0.1; metalness: 0.2;"></a-mixin>
        
        <a-mixin id="sched-text" text="font: kelsonsans; align: center; width: 2.5;"></a-mixin>
      </a-assets>

      <a-marker preset="hiro">
        
        <a-light type="ambient" color="#FFF" intensity="0.5"></a-light>
        <a-light type="directional" color="#FFD700" intensity="1.5" position="1 3 2"></a-light>
        <a-light type="spot" color="#FFF" intensity="1" position="0 2 1" angle="45"></a-light>

        <a-entity position="0 1.5 -0.3" animation="property: position; to: 0 1.55 -0.3; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
          
          <a-plane position="0 0.1 -0.05" width="2.8" height="0.6" material="color: #FFF; transparent: true; opacity: 0.6; roughness: 0.05;"></a-plane>

          <a-entity position="-1.0 0 0" animation="property: rotation; to: -5 0 -2; dur: 3000; dir: alternate; loop: true; easing: linear">
             <a-entity mixin="photo-frame" position="0 0 -0.01"></a-entity>
             <a-plane src="#p1" width="0.5" height="0.5" material="flat"></a-plane>
          </a-entity>

          <a-entity position="-0.5 0 0" animation="property: rotation; to: 5 0 2; dur: 3000; dir: alternate; loop: true; easing: linear; startEvents: 500">
             <a-entity mixin="photo-frame" position="0 0 -0.01"></a-entity>
             <a-plane src="#p2" width="0.5" height="0.5" material="flat"></a-plane>
          </a-entity>

          <a-entity position="0 0 0.1" animation="property: scale; from: 1 1 1; to: 1.03 1.03 1.03; dur: 2500; dir: alternate; loop: true">
             <a-entity mixin="photo-frame" position="0 0 -0.01"></a-entity>
             <a-plane src="#p3" width="0.5" height="0.5" material="flat"></a-plane>
          </a-entity>

          <a-entity position="0.5 0 0" animation="property: rotation; to: -5 0 -2; dur: 3000; dir: alternate; loop: true; easing: linear; startEvents: 1000">
             <a-entity mixin="photo-frame" position="0 0 -0.01"></a-entity>
             <a-plane src="#p4" width="0.5" height="0.5" material="flat"></a-plane>
          </a-entity>

          <a-entity position="1.0 0 0" animation="property: rotation; to: 5 0 2; dur: 3000; dir: alternate; loop: true; easing: linear; startEvents: 1500">
             <a-entity mixin="photo-frame" position="0 0 -0.01"></a-entity>
             <a-plane src="#p5" width="0.5" height="0.5" material="flat"></a-plane>
          </a-entity>
          
          <a-plane position="0 -0.4 0" width="2.8" height="0.02" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 0.8;"></a-plane>
        </a-entity>

        <a-entity position="0 0.2 0" rotation="-12 0 0">
          
          <a-text value="Event Schedule" color="#FFD700" mixin="sched-text" font="https://cdn.aframe.io/fonts/DejaVu-sdf.json" position="0 1.0 0" scale="1.1 1.1 1.1" material="emissive: #FFD700; emissiveIntensity: 1;"></a-text>
          
          <a-plane color="#111" opacity="0.9" width="2.4" height="1.0" position="0 0.25 -0.05" material="roughness: 0.9; metalness: 0.1;"></a-plane>

          <a-entity position="0 0.6 0">
            <a-text value="10:00 AM - Welcome" color="#FFD700" mixin="sched-text" position="0 0 0.05"></a-text>
            <a-plane color="#FFD700" width="1.8" height="0.01" position="0 -0.12 0.02" material="emissive: #FFD700; emissiveIntensity: 0.3"></a-plane>
          </a-entity>

          <a-entity position="0 0.22 0">
            <a-text value="12:00 PM - Wedding Ceremony" color="#FFF" mixin="sched-text" position="0 0 0.05"></a-text>
            <a-plane color="#FFD700" width="1.8" height="0.01" position="0 -0.12 0.02" opacity="0.3"></a-plane>
          </a-entity>

          <a-entity position="0 -0.15 0">
            <a-text value="02:00 PM - Reception Lunch" color="#FFF" mixin="sched-text" position="0 0 0.05"></a-text>
          </a-entity>
          
        </a-entity> 

        <a-entity position="0 0 -0.6" animation="property: rotation; to: 0 10 0; dur: 8000; dir: alternate; loop: true">
          <a-sphere position="-0.8 2 0.1" radius="0.02" color="#FFD700" material="transparent: true; opacity: 0.5" animation="property: position; to: -0.8 0 0.1; dur: 8000; loop: true; easing: linear"></a-sphere>
          <a-sphere position="0.8 2.5 0.3" radius="0.01" color="#FFF" material="transparent: true; opacity: 0.4" animation="property: position; from: 0.8 2.5 0.3; to: 0.8 0 0.3; dur: 9000; loop: true; easing: linear; delay: 1000"></a-sphere>
          <a-sphere position="0 3 0.6" radius="0.015" color="#FFD700" material="transparent: true; opacity: 0.6" animation="property: position; to: 0 0 0.6; dur: 7000; loop: true; easing: linear; delay: 2000"></a-sphere>
          <a-sphere position="-0.3 2.8 0.4" radius="0.01" color="#FFF" material="transparent: true; opacity: 0.5" animation="property: position; to: -0.3 0 0.4; dur: 8500; loop: true; easing: linear; delay: 1500"></a-sphere>
          <a-sphere position="0.4 2.1 0.2" radius="0.01" color="#FFD700" material="transparent: true; opacity: 0.5" animation="property: position; to: 0.4 0 0.2; dur: 10000; loop: true; easing: linear; delay: 500"></a-sphere>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
