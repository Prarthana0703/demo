<!DOCTYPE html>
<html>
<head>
    <title>Wedding Timeline | AR Experience 💍</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
        .loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #2c1a12; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: #f3e5ab; font-family: 'Georgia', serif;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="loading-screen" id="loader">
        <h2>✨ Unveiling the Schedule ✨</h2>
        <p>Point your camera at the Hiro Marker</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;">
        
        <a-assets>
            <img id="hallEnv" src="Back.png">
            <img id="archBoard" src="Display.png">
            <img id="wood" src="wood.jpg">
        </a-assets>

        <a-marker preset="hiro">

            <a-circle src="#wood" rotation="-90 0 0" radius="1.5" position="0 0.01 0" material="roughness: 0.8">
                <a-ring color="#FFD700" radius-inner="1.48" radius-outer="1.5" position="0 0 0.01"></a-ring>
            </a-circle>

            <a-entity 
                geometry="primitive: cylinder; radius: 3; height: 3; thetaStart: 140; thetaLength: 80; openEnded: true"
                material="src: #hallEnv; side: back; shader: flat; transparent: true; opacity: 0.9"
                position="0 1.5 -1.5" 
                rotation="0 0 0">
            </a-entity>

            <a-plane 
                src="#archBoard"
                width="1.4" 
                height="2" 
                position="0 1 -0.4" 
                rotation="0 0 0"
                material="transparent: true; alphaTest: 0.5; shader: flat">
                
                <a-text value="THE WEDDING SCHEDULE" position="0 0.7 0.02" align="center" color="#4A3728" width="3.5" font="serif"></a-text>

                <a-entity position="0 0.35 0.02">
                    <a-text value="HALDI CEREMONY" align="center" color="#5C4033" width="2.5" font="serif"></a-text>
                    <a-text value="10:30 AM" position="0 -0.12 0" align="center" color="#8B4513" width="2"></a-text>
                </a-entity>

                <a-entity position="0 0.05 0.02">
                    <a-text value="BARAAT & SWAGAT" align="center" color="#5C4033" width="2.5" font="serif"></a-text>
                    <a-text value="04:00 PM" position="0 -0.12 0" align="center" color="#8B4513" width="2"></a-text>
                </a-entity>

                <a-entity position="0 -0.25 0.02">
                    <a-text value="SHUBH VIVAH" align="center" color="#5C4033" width="2.5" font="serif"></a-text>
                    <a-text value="06:30 PM" position="0 -0.12 0" align="center" color="#8B4513" width="2"></a-text>
                </a-entity>

                <a-entity position="0 -0.55 0.02">
                    <a-text value="DINNER & SANGEET" align="center" color="#5C4033" width="2.5" font="serif"></a-text>
                    <a-text value="08:30 PM" position="0 -0.12 0" align="center" color="#8B4513" width="2"></a-text>
                </a-entity>
            </a-plane>

            <a-light type="ambient" color="#FFF5CC" intensity="1"></a-light>
            <a-light type="directional" position="1 4 1" intensity="0.5" color="#FFD700"></a-light>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Hide loader when AR camera starts
        window.addEventListener('camera-init', () => {
            document.getElementById('loader').style.display = 'none';
        });
    </script>
</body>
</html>
