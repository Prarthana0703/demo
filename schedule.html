<!DOCTYPE html>
<html>
  <head>
    <title>Decorated AR Wedding Invite</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=300">
        <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=300">
        <img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=300">
        <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=300">
        <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=300">
      </a-assets>

      <a-marker preset="hiro">
        
        <a-entity position="0 1.5 0" animation="property: position; to: 0 1.6 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
          
          <a-entity position="-1.0 0 0">
             <a-plane color="white" width="0.52" height="0.52" position="0 0 -0.01"></a-plane>
             <a-plane src="#p1" width="0.5" height="0.5"></a-plane>
          </a-entity>

          <a-entity position="-0.5 0 0">
             <a-plane color="white" width="0.52" height="0.52" position="0 0 -0.01"></a-plane>
             <a-plane src="#p2" width="0.5" height="0.5"></a-plane>
          </a-entity>

          <a-entity position="0 0 0">
             <a-plane color="white" width="0.52" height="0.52" position="0 0 -0.01"></a-plane>
             <a-plane src="#p3" width="0.5" height="0.5"></a-plane>
          </a-entity>

          <a-entity position="0.5 0 0">
             <a-plane color="white" width="0.52" height="0.52" position="0 0 -0.01"></a-plane>
             <a-plane src="#p4" width="0.5" height="0.5"></a-plane>
          </a-entity>

          <a-entity position="1.0 0 0">
             <a-plane color="white" width="0.52" height="0.52" position="0 0 -0.01"></a-plane>
             <a-plane src="#p5" width="0.5" height="0.5"></a-plane>
          </a-entity>
          
          <a-rect position="0 -0.4 0" width="2.4" height="0.03" color="#FFD700"></a-rect>
        </a-entity>

        <a-entity position="0 0.2 0" rotation="-15 0 0">
          
          <a-text value="Event Schedule" color="#FFD700" align="center" position="0 0.9 0" scale="0.8 0.8 0.8"></a-text>
          <a-text value="Event Schedule" color="#FFF" align="center" position="0 0.9 -0.01" scale="0.82 0.82 0.82" opacity="0.3"></a-text>
          
          <a-entity position="0 0.6 0">
            <a-plane color="#222" opacity="0.85" width="2.2" height="0.32"></a-plane>
            <a-plane color="#FFD700" width="0.05" height="0.32" position="-1.07 0 0.01"></a-plane> <a-text value="10:00 AM - Welcome" color="#FFD700" align="center" position="0 0 0.05" scale="0.45 0.45 0.45"></a-text>
          </a-entity>

          <a-entity position="0 0.22 0">
            <a-plane color="#222" opacity="0.85" width="2.2" height="0.32"></a-plane>
            <a-plane color="#FFD700" width="0.05" height="0.32" position="-1.07 0 0.01"></a-plane>
            <a-text value="12:00 PM - Wedding Ceremony" color="#FFF" align="center" position="0 0 0.05" scale="0.45 0.45 0.45"></a-text>
          </a-entity>

          <a-entity position="0 -0.15 0">
            <a-plane color="#222" opacity="0.85" width="2.2" height="0.32"></a-plane>
            <a-plane color="#FFD700" width="0.05" height="0.32" position="-1.07 0 0.01"></a-plane>
            <a-text value="02:00 PM - Reception Lunch" color="#FFF" align="center" position="0 0 0.05" scale="0.45 0.45 0.45"></a-text>
          </a-entity>
          
        </a-entity> 

        <a-sphere position="-0.8 2 0" radius="0.02" color="#FFD700" animation="property: position; to: -0.8 0 0; dur: 3000; loop: true; easing: linear"></a-sphere>
        <a-sphere position="0.8 2.5 0.2" radius="0.02" color="#FFF" animation="property: position; to: 0.8 0 0.2; dur: 4000; loop: true; easing: linear"></a-sphere>
        <a-sphere position="0 3 0.5" radius="0.02" color="#FFD700" animation="property: position; to: 0 0 0.5; dur: 5000; loop: true; easing: linear"></a-sphere>

      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
