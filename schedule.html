<!DOCTYPE html>
<html>
<head>
    <title>AR Wedding - Fixed ✨</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>

<body>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
        <img id="hallEnv" src="Back.png">
        <img id="archBoard" src="Display.png">
        <img id="wood" src="texture.jpg">

        <img id="g_bride" src="Bride.png">
        <img id="g_barat" src="Barat.png">
        <img id="g_sanget" src="Sangeet.png">
    </a-assets>

    <a-marker preset="hiro">

        <!-- ✅ Floor -->
        <a-circle 
            rotation="-90 0 0" 
            radius="1.2" 
            position="0 0 0"
            material="src: #wood">
        </a-circle>

        <!-- ✅ FIXED CURVED BACKGROUND -->
        <a-entity 
            geometry="primitive: cylinder; radius: 2; height: 2.5; thetaStart: 110; thetaLength: 140; openEnded: true"
            material="src: #hallEnv; side: back; shader: flat"
            position="0 1.2 -2">
        </a-entity>

        <!-- ✅ MAIN CONTENT -->
        <a-entity position="0 0.8 -0.5">

            <!-- ✅ BOARD FIXED -->
            <a-entity position="-0.5 1 0.3">
                <a-plane 
                    src="#archBoard" 
                    width="1.2" 
                    height="1.4"
                    material="transparent: true; alphaTest: 0.5">
                </a-plane>

                <!-- TEXT (moved forward to avoid glitch) -->
                <a-text value="WEDDING SCHEDULE"
                        position="0 0.5 0.05"
                        align="center"
                        color="#4A3728"
                        width="2.5"></a-text>

                <a-text value="HALDI - 10:30 AM"
                        position="0 0.2 0.05"
                        align="center"
                        color=#4A3728;
                        width="2"></a-text>

                <a-text value="BARAAT - 04:00 PM"
                        position="0 0 0.05"
                        align="center"
                        width="2"></a-text>

                <a-text value="WEDDING - 06:30 PM"
                        position="0 -0.2 0.05"
                        align="center"
                        width="2"></a-text>

                <a-text value="DINNER - 08:30 PM"
                        position="0 -0.4 0.05"
                        align="center"
                        width="2"></a-text>
            </a-entity>

            <!-- ✅ GALLERY FIXED -->
            <a-entity position="0.5 0 0">

                <a-plane src="#g_bride" width="0.3" height="0.4" position="0 0.3 0.05"></a-plane>

                <a-plane src="#g_barat" width="0.3" height="0.4" position="0 -0.1 0.05"></a-plane>

                <a-plane src="#g_sanget" width="0.3" height="0.4" position="0 -0.5 0.05"></a-plane>

            </a-entity>

        </a-entity>

        <!-- ✅ LIGHT -->
        <a-light type="ambient" intensity="1.5"></a-light>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
