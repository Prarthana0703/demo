<!DOCTYPE html>
<html>
<head>
<title>AR Horizontal Sliding Gallery</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

<style>
canvas {
    background: transparent !important;
}
</style>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene
embedded
renderer="alpha: true; antialias: true;"
vr-mode-ui="enabled:false"
arjs="sourceType: webcam; debugUIEnabled:false;">

<a-assets>
<!-- ⚠️ IMPORTANT: Rename your files like this -->
<img id="photo1" src="photo1.png">
<img id="photo2" src="photo2.png">
<img id="photo3" src="photo3.jpg">
<img id="photo4" src="photo4.jpg">
</a-assets>

<a-marker
preset="hiro"
id="hiro-marker"
smooth="true"
smoothCount="10"
smoothTolerance="0.01"
smoothThreshold="5">

<!-- TEXT -->
<a-text
id="welcomeText"
value="Our Journey"
position="0 0.6 -1.2"
align="center"
color="#FFD700"
rotation="-90 0 0"
scale="1.3 1.3 1.3">
</a-text>

<!-- GALLERY -->
<a-entity
id="gallery-container"
position="0 0.1 0"
animation="property: position;
           from: 1.5 0.1 0;
           to: -1.5 0.1 0;
           dur: 10000;
           dir: alternate;
           loop: true;
           easing: linear">

<!-- PHOTO 1 -->
<a-entity position="-1.5 0 0">
<a-plane color="#FFD700" width="1.35" height="1.75" rotation="-90 0 0"></a-plane>
<a-image src="#photo1" rotation="-90 0 0" width="1.25" height="1.65" position="0 0 0.01"></a-image>
</a-entity>

<!-- PHOTO 2 -->
<a-entity position="0 0 0">
<a-plane color="#FFD700" width="1.35" height="1.75" rotation="-90 0 0"></a-plane>
<a-image src="#photo2" rotation="-90 0 0" width="1.25" height="1.65" position="0 0 0.01"></a-image>
</a-entity>

<!-- PHOTO 3 -->
<a-entity position="1.5 0 0">
<a-plane color="#FFD700" width="1.35" height="1.75" rotation="-90 0 0"></a-plane>
<a-image src="#photo3" rotation="-90 0 0" width="1.25" height="1.65" position="0 0 0.01"></a-image>
</a-entity>

<!-- PHOTO 4 -->
<a-entity position="3 0 0">
<a-plane color="#FFD700" width="1.35" height="1.75" rotation="-90 0 0"></a-plane>
<a-image src="#photo4" rotation="-90 0 0" width="1.25" height="1.65" position="0 0 0.01"></a-image>
</a-entity>

</a-entity>

<!-- SCHEDULE -->
<a-text value="Wedding Schedule"
position="0 0.01 1.5"
align="center"
color="#FFD700"
rotation="-90 0 0"
scale="1.2 1.2 1.2"></a-text>

<a-plane position="0 0.01 2.2" rotation="-90 0 0"
width="4" height="0.05" color="#FF6B9D"></a-plane>

<a-entity position="-1.8 0 2.7">
<a-plane width="0.9" height="0.6" color="#221500" rotation="-90 0 0"></a-plane>
<a-text value="08:00 AM\nHaldi" position="0 0.01 0"
align="center" color="#FFD700" rotation="-90 0 0" width="2"></a-text>
</a-entity>

<a-entity position="0 0 2.7">
<a-plane width="0.9" height="0.6" color="#220018" rotation="-90 0 0"></a-plane>
<a-text value="02:00 PM\nMehendi" position="0 0.01 0"
align="center" color="#FF69B4" rotation="-90 0 0" width="2"></a-text>
</a-entity>

<a-entity position="1.8 0 2.7">
<a-plane width="0.9" height="0.6" color="#221000" rotation="-90 0 0"></a-plane>
<a-text value="07:00 PM\nSangeet" position="0 0.01 0"
align="center" color="#FFA500" rotation="-90 0 0" width="2"></a-text>
</a-entity>

<a-plane position="0 0 0" rotation="-90 0 0"
width="4" height="3" color="#000" opacity="0.25"></a-plane>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

<script>
window.addEventListener("load", () => {

    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "Guest";

    name = name.charAt(0).toUpperCase() + name.slice(1);

    let message = `Welcome ${name} ❤️\nOur Journey`;

    setTimeout(() => {
        const textEl = document.querySelector("#welcomeText");
        if (textEl) {
            textEl.setAttribute("value", message);
        }
    }, 1000);

});
</script>

</body>
</html>
