<!DOCTYPE html>
<html>
  <head>
    <title>AR Wedding Gallery & Schedule</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-text-geometry-component@0.5.1/dist/aframe-text-geometry-component.min.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <img id="photo1" src="PLACEHOLDER_PHOTO_1.jpg"> <img id="photo2" src="PLACEHOLDER_PHOTO_2.jpg"> <img id="photo3" src="PLACEHOLDER_PHOTO_3.jpg"> <img id="photo4" src="PLACEHOLDER_PHOTO_4.jpg"> <img id="photo5" src="PLACEHOLDER_PHOTO_5.jpg"> </a-assets>

      <a-marker preset="hiro">
        
        <a-entity position="0 1.2 0">
          
          <a-plane src="#photo1" position="-1.2 0 0" width="0.5" height="0.5" rotation="0 0 0"></a-plane>
          
          <a-plane src="#photo2" position="-0.6 0 0" width="0.5" height="0.5"></a-plane>
          
          <a-plane src="#photo3" position="0 0 0" width="0.5" height="0.5"></a-plane>
          
          <a-plane src="#photo4" position="0.6 0 0" width="0.5" height="0.5"></a-plane>
          
          <a-plane src="#photo5" position="1.2 0 0" width="0.5" height="0.5"></a-plane>
          
          <a-box position="0 -0.3 0" width="2.4" height="0.02" depth="0.01" color="#444"></a-box>
          <a-box position="-0.8 -0.3 0" width="0.4" height="0.04" depth="0.02" color="#eee"></a-box> </a-entity>

        <a-entity position="0 0.2 0" rotation="-30 0 0"> <a-text value="Event Schedule" color="#F4D03F" align="center" position="0 0.8 0" scale="0.6 0.6 0.6" font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"></a-text>
          
          <a-entity position="0 0.5 0">
            <a-plane color="#222" opacity="0.9" width="1.6" height="0.25"></a-plane> <a-text value="10:00 AM" color="#F4D03F" align="left" position="-0.7 0 0.01" scale="0.3 0.3 0.3"></a-text> <a-text value="- Welcome" color="#eee" align="left" position="-0.1 0 0.01" scale="0.3 0.3 0.3"></a-text> </a-entity>
          
          <a-text value="V" color="#F4D03F" align="center" position="0 0.35 0" scale="0.4 0.4 0.4"></a-text>
          
          <a-entity position="0 0.2 0">
            <a-plane color="#222" opacity="0.9" width="1.8" height="0.25"></a-plane>
            <a-text value="12:00 PM" color="#F4D03F" align="left" position="-0.8 0 0.01" scale="0.3 0.3 0.3"></a-text>
            <a-text value="- Wedding Ceremony" color="#eee" align="left" position="-0.1 0 0.01" scale="0.3 0.3 0.3"></a-text>
          </a-entity>
          
          <a-text value="V" color="#F4D03F" align="center" position="0 0.05 0" scale="0.4 0.4 0.4"></a-text>
          
          <a-entity position="0 -0.1 0">
            <a-plane color="#222" opacity="0.9" width="1.8" height="0.25"></a-plane>
            <a-text value="2:00 PM" color="#F4D03F" align="left" position="-0.8 0 0.01" scale="0.3 0.3 0.3"></a-text>
            <a-text value="- Reception Lunch" color="#eee" align="left" position="-0.1 0 0.01" scale="0.3 0.3 0.3"></a-text>
          </a-entity>
          
        </a-entity> </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
