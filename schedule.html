<!DOCTYPE html>
<html>
  <head>
    <title>Premium AR Wedding Invitation</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;">
      
      <a-assets>
        <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=600" crossOrigin="anonymous">
        <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=600" crossOrigin="anonymous">
        <img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=600" crossOrigin="anonymous">
        <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=600" crossOrigin="anonymous">
        <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=600" crossOrigin="anonymous">
        
        <a-mixin id="frame" geometry="primitive: plane; width: 0.54; height: 0.54" material="color: #FFF; shader: standard; emissive: #FFD700; emissiveIntensity: 0.1"></a-mixin>
      </a-assets>

      <a-marker preset="hiro">
        
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>

        <a-entity rotation="-90 0 0" position="0 0.05 0">
           <a-plane width="2.4" height="1.4" color="#111" opacity="0.9" material="transparent: true"></a-plane>
           
           <a-text value="Event Schedule" color="#FFD700" align="center" position="0 0.5 0.02" width="5" font="roboto"></a-text>
           
           <a-text value="10:00 AM - Welcome Drinks\n\n12:00 PM - Wedding Ceremony\n\n02:00 PM - Reception & Lunch" 
                   color="#FFF" align="center" position="0 -0.1 0.02" width="3.5" line-height="50" font="roboto"></a-text>
           
           <a-plane color="#FFD700" width="1.8" height="0.02" position="0 -0.55 0.03"></a-plane>
        </a-entity>

        <a-entity position="0 0.6 0">
            <a-entity position="-1.3 0.2 0.6" rotation="0 45 0" animation="property: position; to: -1.3 0.28 0.6; dir: alternate; dur: 2000; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p1" width="0.5" height="0.5" material="shader: flat; transparent: true"></a-plane>
            </a-entity>

            <a-entity position="-0.7 0.5 0.2" rotation="0 25 0" animation="property: position; to: -0.7 0.58 0.2; dir: alternate; dur: 2200; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p2" width="0.5" height="0.5" material="shader: flat; transparent: true"></a-plane>
            </a-entity>

            <a-entity position="0 0.8 -0.3" rotation="0 0 0" animation="property: scale; from: 1 1 1; to: 1.06 1.06 1.06; dir: alternate; dur: 2500; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p3" width="0.5" height="0.5" material="shader: flat; transparent: true"></a-plane>
            </a-entity>

            <a-entity position="0.7 0.5 0.2" rotation="0 -25 0" animation="property: position; to: 0.7 0.58 0.2; dir: alternate; dur: 2200; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p4" width="0.5" height="0.5" material="shader: flat; transparent: true"></a-plane>
            </a-entity>

            <a-entity position="1.3 0.2 0.6" rotation="0 -45 0" animation="property: position; to: 1.3 0.28 0.6; dir: alternate; dur: 2000; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p5" width="0.5" height="0.5" material="shader: flat; transparent: true"></a-plane>
            </a-entity>
        </a-entity>

        <a-entity position="0 1.5 0">
            <a-sphere position="-0.6 0 0.4" radius="0.015" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 2" animation="property: position; to: -0.6 -1.8 0.4; dur: 4500; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0.6 0.5 -0.4" radius="0.012" color="#FFF" animation="property: position; to: 0.6 -1.8 -0.4; dur: 5500; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0 0.9 0.6" radius="0.02" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 2" animation="property: position; to: 0 -1.8 0.6; dur: 3500; loop: true; easing: linear"></a-sphere>
        </a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
