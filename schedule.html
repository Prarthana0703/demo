<!DOCTYPE html>
<html>
<head>
    <title>The Celebration | Final Fixed Alignment ✨</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    
    <style>
        .loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #2c1a12; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: #f3e5ab; font-family: 'Georgia', serif;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="loading-screen" id="loader">
        <h2>✨ Unveiling 'The Celebration' ✨</h2>
        <p>Point your camera at the Hiro Marker</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;">
        
        <a-assets>
            <img id="hallEnv" src="Back.png">
            <img id="archBoard" src="Display.png">
            <img id="wood" src="texture.jpg">
            
            <img id="g_bride" src="bride.png">
            <img id="g_barat" src="barat.png">
            <img id="g_sanget" src="Sanget.png">
            <img id="g_reception" src="Reception.png">

            <a-mixin id="boardText" material="shader: flat" align="center" font="serif"></a-mixin>
            <a-mixin id="photoFrame" geometry="primitive: plane; width: 0.35; height: 0.45" material="color: #ffffff; shader: standard; roughness: 0.2; metalness: 0.8"></a-mixin>
            <a-mixin id="sparkle" geometry="primitive: sphere; radius: 0.012" material="shader: flat; opacity: 0.8; transparent: true"></a-mixin>
        </a-assets>

        <a-marker preset="hiro">

            <a-circle rotation="-90 0 0" radius="1.4" position="0 0.01 0" material="src: #wood; color: #ffffff; roughness: 0.8">
                <a-ring color="#B38B6D" radius-inner="1.38" radius-outer="1.4" position="0 0 0.01"></a-ring>
            </a-circle>

            <a-entity 
                geometry="primitive: cylinder; radius: 2; height: 2.2; thetaStart: 125; thetaLength: 110; openEnded: true"
                material="src: #hallEnv; side: back; shader: flat; transparent: false; opacity: 1"
                position="0 1.1 -1">
            </a-entity>

            <a-entity id="mainInterface" position="0 0.9 -0.4">
                
                <a-entity id="boardEntity" position="-0.4 0 0" rotation="0 5 0">
                    <a-plane src="#archBoard" width="0.9" height="1.6" material="transparent: true; alphaTest: 0.5; shader: flat"></a-plane>
                    
                    <a-entity position="0 0 0.12">
                        <a-text value="THE WEDDING SCHEDULE" position="0 0.6 0" mixin="boardText" color="#4A3728" width="3"></a-text>

                        <a-entity position="0 0.35 0">
                            <a-text value="HALDI CEREMONY" mixin="boardText" color="#5C4033" width="2"></a-text>
                            <a-text value="10:30 AM" position="0 -0.1 0" mixin="boardText" color="#8B4513" width="1.6"></a-text>
                        </a-entity>

                        <a-entity position="0 0.05 0">
                            <a-text value="BARAAT & SWAGAT" mixin="boardText" color="#5C4033" width="2"></a-text>
                            <a-text value="04:00 PM" position="0 -0.1 0" mixin="boardText" color="#8B4513" width="1.6"></a-text>
                        </a-entity>

                        <a-entity position="0 -0.25 0">
                            <a-text value="SHUBH VIVAH" mixin="boardText" color="#5C4033" width="2"></a-text>
                            <a-text value="06:30 PM" position="0 -0.1 0" mixin="boardText" color="#8B4513" width="1.6"></a-text>
                        </a-entity>

                        <a-entity position="0 -0.55 0">
                            <a-text value="DINNER & SANGEET" mixin="boardText" color="#5C4033" width="2"></a-text>
                            <a-text value="08:30 PM" position="0 -0.1 0" mixin="boardText" color="#8B4513" width="1.6"></a-text>
                        </a-entity>
                    </a-entity>
                </a-entity>

                <a-entity id="galleryCluster" position="0.5 0 0" rotation="0 -10 0">
                    <a-entity position="-0.1 0.4 0.02" rotation="0 0 -5">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#g_bride" width="0.3" height="0.4" position="0 0 0.02" material="shader: flat"></a-plane>
                    </a-entity>
                    <a-entity position="0.1 0.1 0.04" rotation="0 0 3">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#g_barat" width="0.3" height="0.4" position="0 0 0.02" material="shader: flat"></a-plane>
                    </a-entity>
                    <a-entity position="-0.05 -0.25 0.03" rotation="0 0 7">
                        <a-plane mixin="photoFrame" position="0 0 0.01"></a-plane>
                        <a-plane src="#g_sanget" width="0.3" height="0.4" position="0 0 0.02" material="shader: flat"></a-plane>
                    </a-entity>
                </a-entity>
            </a-entity>

            <a-entity id="sparkles">
                <a-entity mixin="sparkle" color="#FFD700" position="-0.6 1.4 0.5" animation="property: position; to: -0.6 1.1 0.5; dur: 3000; dir: alternate; loop: true"></a-entity>
                <a-entity mixin="sparkle" color="#FFFFFF" position="0.7 1.0 0.4" animation="property: scale; from: 1 1 1; to: 0.2 0.2 0.2; dur: 1000; dir: alternate; loop: true"></a-entity>
            </a-entity>

            <a-light type="ambient" color="#FFF5CC" intensity="1.6"></a-light>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('camera-init', () => {
            document.getElementById('loader').style.display = 'none';
        });
    </script>
</body>
</html>
