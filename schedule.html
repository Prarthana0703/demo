<!DOCTYPE html>
<html>
  <head>
    <title>Premium Curved AR Wedding Invite</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true; logarithmicDepthBuffer: true;">
      
      <a-assets>
        <img id="p1" src="http://googleusercontent.com/image_collection/image_retrieval/17799533635495406612_0" crossorigin="anonymous">
        <img id="p2" src="http://googleusercontent.com/image_collection/image_retrieval/12419079260717358826_1" crossorigin="anonymous">
        <img id="p3" src="http://googleusercontent.com/image_collection/image_retrieval/12419079260717358826_0" crossorigin="anonymous">
        <img id="p4" src="http://googleusercontent.com/image_collection/image_retrieval/12419079260717358826_4" crossorigin="anonymous">
        <img id="p5" src="http://googleusercontent.com/image_collection/image_retrieval/17799533635495406612_1" crossorigin="anonymous">
        
        <a-mixin id="frame" geometry="primitive: plane; width: 0.56; height: 0.56" material="color: #FFF; shader: standard; emissive: #FFD700; emissiveIntensity: 0.2; metalness: 0.5; roughness: 0.2"></a-mixin>
      </a-assets>

      <a-marker preset="hiro">
        
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFD700" intensity="1.2" position="1 3 1"></a-light>
        <a-light type="point" color="#FFF" intensity="0.8" position="0 2 0"></a-light>

        <a-entity rotation="-90 0 0" position="0 0.05 0">
           <a-plane width="2.6" height="1.5" color="#0a0a0a" opacity="0.9" material="transparent: true; roughness: 0.8; metalness: 0.1"></a-plane>
           
           <a-text value="The Wedding Schedule" color="#FFD700" align="center" position="0 0.55 0.05" width="4.8" font="https://cdn.aframe.io/fonts/DejaVu-sdf.json" material="emissive: #FFD700; emissiveIntensity: 0.4"></a-text>
           
           <a-text value="10:30 AM - Welcome Refreshments\n\n12:30 PM - The Marriage Ceremony\n\n02:30 PM - Grand Reception & Toast" 
                   color="#FFF" align="center" position="0 -0.1 0.05" width="3.4" line-height="60"></a-text>
           
           <a-plane color="#FFD700" width="2.0" height="0.02" position="0 -0.6 0.06" animation="property: scale; from: 0 1 1; to: 1 1 1; dur: 1500; easing: easeOutExpo"></a-plane>
        </a-entity>

        <a-entity position="0 0.5 0">
            <a-entity position="-1.4 0.2 0.7" rotation="0 50 0" animation="property: position; to: -1.4 0.28 0.7; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p1" width="0.52" height="0.52" material="shader: flat; side: double"></a-plane>
            </a-entity>

            <a-entity position="-0.75 0.55 0.2" rotation="0 25 0" animation="property: position; to: -0.75 0.63 0.2; dir: alternate; dur: 2200; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p2" width="0.52" height="0.52" material="shader: flat; side: double"></a-plane>
            </a-entity>

            <a-entity position="0 0.85 -0.4" rotation="0 0 0" animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 2500; loop: true">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p3" width="0.52" height="0.52" material="shader: flat; side: double"></a-plane>
            </a-entity>

            <a-entity position="0.75 0.55 0.2" rotation="0 -25 0" animation="property: position; to: 0.75 0.63 0.2; dir: alternate; dur: 2200; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p4" width="0.52" height="0.52" material="shader: flat; side: double"></a-plane>
            </a-entity>

            <a-entity position="1.4 0.2 0.7" rotation="0 -50 0" animation="property: position; to: 1.4 0.28 0.7; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p5" width="0.52" height="0.52" material="shader: flat; side: double"></a-plane>
            </a-entity>
        </a-entity>

        <a-entity position="0 1.5 0">
            <a-sphere position="-0.7 0 0.5" radius="0.02" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 3" animation="property: position; to: -0.7 -2.0 0.5; dur: 4000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0.8 0.5 -0.5" radius="0.015" color="#FFF" material="emissive: #FFF; emissiveIntensity: 1" animation="property: position; to: 0.8 -2.0 -0.5; dur: 6000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0 1.0 0.7" radius="0.025" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 3" animation="property: position; to: 0 -2.0 0.7; dur: 3000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="-1.2 0.4 -0.3" radius="0.01" color="#FFF" animation="property: position; to: -1.2 -2.0 -0.3; dur: 7000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0.4 0.8 0.2" radius="0.018" color="#FFD700" animation="property: position; to: 0.4 -2.0 0.2; dur: 5000; loop: true; easing: linear"></a-sphere>
        </a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
