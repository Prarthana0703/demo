<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Premium AR Wedding Invite 💍</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#invite-btn {position:fixed;bottom:20px;left:20px;width:55px;height:55px;border-radius:50%;border:none;font-size:22px;background:#ff69b4;color:white;z-index:999;box-shadow:0 4px 10px rgba(0,0,0,.4);cursor:pointer}
#invite-box {position:fixed;bottom:90px;left:20px;width:220px;padding:12px;background:rgba(0,0,0,.85);color:white;border-radius:10px;font-size:14px;display:none;z-index:999;border:1px solid #FFD700}
#ocr-status {position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:92vw;padding:8px 12px;background:rgba(0,0,0,.78);color:#fff5cc;border:1px solid #FFD700;border-radius:9px;font:12px Arial,sans-serif;text-align:center;z-index:999;pointer-events:none}
a-scene,.a-canvas {background:transparent!important}
</style>
</head>
<body>
<button id="invite-btn" onclick="showInvite()">💌</button>
<div id="invite-box"><p>You are warmly invited to celebrate the wedding of <b>Rahul</b> &amp; <b>Saira</b>. Your presence will make this occasion truly special. 💍<br><br>Please do come and bless us ❤️</p></div>
<div id="ocr-status" role="status">Preparing live camera OCR...</div>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;" vr-mode-ui="enabled:false">
<a-assets>
<img id="bg" src="Background.png" crossorigin="anonymous">
<img id="board" src="board.png" crossorigin="anonymous">
<img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500" crossorigin="anonymous">
<img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=500" crossorigin="anonymous">
<img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=500" crossorigin="anonymous">
<img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=500" crossorigin="anonymous">
<img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500" crossorigin="anonymous">
<img id="marble" src="stage.png" crossorigin="anonymous">
<a-mixin id="frame" geometry="primitive: plane; width: 0.54; height: 0.54" material="color: #FFF; shader: standard; emissive: #FFD700; emissiveIntensity: 0.1"></a-mixin>
</a-assets>
<a-entity id="music"></a-entity>
<a-light type="ambient" intensity="1.2"></a-light>
<a-light type="directional" position="1 4 1" intensity="1"></a-light>
<a-marker preset="hiro">
<a-entity geometry="primitive: cylinder; radius: 2; height: 3; thetaStart: 120; thetaLength: 120; openEnded: true" material="src: #bg; side: back; shader: flat; transparent: true; opacity: 1" position="0 0 -0.75" rotation="0 0 0"></a-entity>
<!-- Corrected duplicate/incomplete a-circle opening tag -->
<a-circle src="texture.jpg" rotation="-90 0 0" radius="1" position="0 0.01 0" material="roughness: 0.8; metalness: 0.1" crossorigin="anonymous">
<a-ring src="wood.jpg" radius-inner="0.95" radius-outer="1.05" position="0 0 0.01" material="shader: standard; roughness: 0.6; metalness: 0.2"></a-ring>
</a-circle>
<a-circle color="#000" opacity="0.2" radius="1.1" rotation="-90 0 0" position="0 0.005 0"></a-circle>
<a-entity gltf-model="wedding_gate-v1.glb" position="0 0 -0.8" scale="1.5 1.5 1.5"></a-entity>
<a-entity gltf-model="couple.glb" position="0 1 0.2" scale="0.75 0.75 0.75" animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true"></a-entity>
<a-entity position="0 2.5 -0.5" look-at="[camera]">
<a-text value="RAHUL WEDS SAIRA" align="center" color="#FFD700" width="5" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1200; loop: true"></a-text>
<a-text value="RAHUL WEDS SAIRA" align="center" color="#000" width="5" opacity="0.4" position="0.03 -0.03 -0.01"></a-text>
</a-entity>
<a-plane src="#board" width="0.7" height="1.2" position="0.8 0.6 0.4" rotation="0 -20 0" material="transparent: true; alphaTest: 0.5; shader: flat" look-at="[camera]"></a-plane>
<a-entity id="petal-container">
<a-plane src="rose_petal.png" position="-0.8 3 0" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.8 0 0; dur: 4000; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="0.8 3.5 0.5" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: 0.8 0 0.5; dur: 5000; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="-0.3 4 -0.5" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="-0.6 2.3 0.1" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="-0.8 2.1 -0.7" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="-0.1 3.2 -0.9" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
<a-plane src="rose_petal.png" position="-0.1 2.8 -1" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
</a-entity>
<a-text id="detected-name" value="" position="0 -0.8 1" align="center" color="#FF69B4" width="6" font="roboto" look-at="[camera]"></a-text>
<a-text id="personal-msg" value="Scanning name..." position="0 -1.3 1" align="center" color="#FFF5CC" width="4" font="roboto" look-at="[camera]"></a-text>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
"use strict";
let lastName="";
let processing=false;
let nameDetected=false;
let scanTimer=null;
let musicStarted=false;
function setOCRStatus(message){document.getElementById("ocr-status").textContent=message;}
function speak(text){if("speechSynthesis" in window){speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(text);msg.lang="en-IN";speechSynthesis.speak(msg);}}
window.addEventListener("click",()=>{
 if(musicStarted)return;
 const music=document.querySelector("#music");
 musicStarted=true;
 music.setAttribute("sound",{src:"url(wedding-music.mp3)",autoplay:true,loop:true,volume:0.7});
},{once:true});
function showInvite(){const box=document.getElementById("invite-box");box.style.display=box.style.display==="block"?"none":"block";}
/* Only accept a name explicitly introduced on the printed card. */
function extractName(text){
 const lines=String(text||"").split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
 const forbidden=/\b(?:wedding|invitation|welcome|rahul|saira|hiro|marker|ceremony|celebration|special|bless)\b/i;
 for(let i=0;i<lines.length;i++){
  let match=lines[i].match(/^(?:guest(?:\s+name)?|name|dear|to)\s*[:.,-]?\s+([A-Za-z][A-Za-z '\-]{1,39})$/i);
  let candidate=match?.[1]||"";
  if(!candidate&&/^(?:guest(?:\s+name)?|name|dear|to)\s*[:.,-]?\s*$/i.test(lines[i]))candidate=lines[i+1]||"";
  candidate=candidate.replace(/[^A-Za-z '\-]/g," ").replace(/\s+/g," ").trim();
  if(candidate.length>=2&&candidate.length<=40&&!forbidden.test(candidate)&&candidate.split(" ").length<=4)return candidate;
 }
 return "";
}
function scheduleRetry(){if(!nameDetected){clearTimeout(scanTimer);scanTimer=setTimeout(scan,2500);}}
async function scan(){
 if(processing||nameDetected)return;
 const video=[...document.querySelectorAll("video")].find(v=>v.videoWidth>0&&v.readyState>=2);
 if(!video){setOCRStatus("Waiting for live AR camera...");scanTimer=setTimeout(scan,1000);return;}
 if(!window.Tesseract){setOCRStatus("OCR library unavailable.");return;}
 processing=true;
 setOCRStatus("Scanning live camera for guest name...");
 try{
  const canvas=document.createElement("canvas");
  const scale=Math.min(1,1280/video.videoWidth);
  canvas.width=Math.round(video.videoWidth*scale);
  canvas.height=Math.round(video.videoHeight*scale);
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3;d[i]=d[i+1]=d[i+2]=g;}
  ctx.putImageData(imgData,0,0);
  const result=await Tesseract.recognize(canvas,"eng");
  const name=extractName(result?.data?.text||"");
  if(name&&!nameDetected){
   nameDetected=true;
   lastName=name;
   clearTimeout(scanTimer);
   const msg=`Dear ${name}, you are warmly invited to the wedding of Rahul and Saira.`;
   const displayMsg=`Dear ${name},\nYou are warmly invited to celebrate the wedding of\nRahul & Saira 💍\nPlease do come and bless us ❤️`;
   document.querySelector("#personal-msg").setAttribute("value",displayMsg);
   document.querySelector("#detected-name").setAttribute("value",name.toUpperCase());
   setOCRStatus(`Welcome ${name} — name detected. OCR stopped.`);
   speak(msg);
  }else if(!nameDetected){setOCRStatus("No guest name found yet. Show a card labeled Guest: Name.");}
 }catch(err){console.error("OCR:",err);setOCRStatus("OCR error: "+(err.message||err));}
 finally{processing=false;scheduleRetry();}
}
scanTimer=setTimeout(scan,3000);
window.addEventListener("pagehide",()=>{clearTimeout(scanTimer);nameDetected=true;if("speechSynthesis" in window)speechSynthesis.cancel();});
</script>
</body>
</html>
