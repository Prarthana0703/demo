<!DOCTYPE html>
<html>
<head>
    <title>Premium AR Wedding Invite 💍</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        #invite-btn { position: fixed; bottom: 20px; left: 20px; width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 22px; background: #ff69b4; color: white; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; }
        #invite-box { position: fixed; bottom: 90px; left: 20px; width: 220px; padding: 12px; background: rgba(0,0,0,0.85); color: white; border-radius: 10px; font-size: 14px; display: none; z-index: 999; border: 1px solid #FFD700; }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

<button id="invite-btn" onclick="showInvite()">💌</button>
<div id="invite-box">
    <p>You are warmly invited to celebrate the wedding of <b>Rahul</b> & <b>Saira</b>. 💍<br><br>Please do come and bless us ❤️</p>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true;">
    
    <a-assets>
        <img id="bg" src="Background.png" crossorigin="anonymous">
        <img id="marble" src="stage.png" crossorigin="anonymous">
        
        <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500" crossorigin="anonymous">
        <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=500" crossorigin="anonymous">
        <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=500" crossorigin="anonymous">
        <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500" crossorigin="anonymous">
        
        <a-mixin id="frame" geometry="primitive: plane; width: 0.54; height: 0.54" material="color: #FFF; shader: standard; emissive: #FFD700; emissiveIntensity: 0.1"></a-mixin>
    </a-assets>

    <a-entity id="music"></a-entity>
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 4 1" intensity="1"></a-light>

    <a-marker preset="hiro">

        <a-circle src="#marble" rotation="-90 0 0" radius="1.3" position="0 0.01 0" material="roughness: 0.2; metalness: 0.3">
            <a-ring color="#FFD700" radius-inner="1.28" radius-outer="1.3" position="0 0 0.01"></a-ring>
        </a-circle>

        <a-entity geometry="primitive: cylinder; radius: 1.8; height: 1.5; thetaStart: 150; thetaLength: 60; openEnded: true"
                  material="src: #bg; side: back; shader: flat; transparent: true; opacity: 0.9"
                  position="0 0.75 -0.9" 
                  rotation="0 0 0">
        </a-entity>

        <a-entity gltf-model="wedding_gate-v1.glb" position="0 0 -0.8" scale="1.5 1.5 1.5"></a-entity>
        <a-entity gltf-model="couple.glb" position="0 0 0.2" scale="0.75 0.75 0.75" animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true"></a-entity>

        <a-entity position="0 2.2 -0.5" look-at="[camera]">
            <a-text value="RAHUL WEDS SAIRA" align="center" color="#FFD700" width="5" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1200; loop: true"></a-text>
            <a-text value="RAHUL WEDS SAIRA" align="center" color="#000" width="5" opacity="0.4" position="0.03 -0.03 -0.01"></a-text>
        </a-entity>

        <a-entity position="0 0.8 0">
            <a-entity position="-1.3 0.2 0.6" rotation="0 45 0" animation="property: position; to: -1.3 0.28 0.6; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p1" width="0.5" height="0.5" material="shader: flat; transparent: true" crossorigin="anonymous"></a-plane>
            </a-entity>
            <a-entity position="-0.7 0.5 0.2" rotation="0 25 0" animation="property: position; to: -0.7 0.58 0.2; dir: alternate; dur: 2200; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p2" width="0.5" height="0.5" material="shader: flat; transparent: true" crossorigin="anonymous"></a-plane>
            </a-entity>
            <a-entity position="0.7 0.5 0.2" rotation="0 -25 0" animation="property: position; to: 0.7 0.58 0.2; dir: alternate; dur: 2200; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p4" width="0.5" height="0.5" material="shader: flat; transparent: true" crossorigin="anonymous"></a-plane>
            </a-entity>
            <a-entity position="1.3 0.2 0.6" rotation="0 -45 0" animation="property: position; to: 1.3 0.28 0.6; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
                <a-entity mixin="frame" position="0 0 -0.01"></a-entity>
                <a-plane src="#p5" width="0.5" height="0.5" material="shader: flat; transparent: true" crossorigin="anonymous"></a-plane>
            </a-entity>
        </a-entity>

        <a-entity id="petal-container">
            <a-plane src="rose_petal.png" position="-0.8 3 0" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.8 0 0; dur: 4000; loop: true; easing: linear"></a-plane>
            <a-plane src="rose_petal.png" position="0.8 3.5 0.5" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: 0.8 0 0.5; dur: 5000; loop: true; easing: linear"></a-plane>
            <a-plane src="rose_petal.png" position="-0.3 4 -0.5" width="0.2" height="0.2" material="transparent:true;side:double" look-at="[camera]" animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear"></a-plane>
        </a-entity>

        <a-text id="detected-name" value="" position="0 -0.8 1" align="center" color="#FF69B4" width="6" font="roboto" look-at="[camera]"></a-text>
        <a-text id="personal-msg" value="Scanning name..." position="0 -1.3 1" align="center" color="#FFF5CC" width="4" font="roboto" look-at="[camera]"></a-text>

    </a-marker>
    <a-entity camera></a-entity>
</a-scene>

<script>
    /* Javascript logic remains identical */
    let lastName = "";
    let processing = false;
    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(msg);
    }
    window.addEventListener("click", () => {
        const music = document.querySelector("#music");
        if (!music.components.sound) {
            music.setAttribute("sound", { src: "url(wedding-music.mp3)", autoplay: true, loop: true, volume: 0.7 });
        } else { music.components.sound.playSound(); }
    });
    function showInvite() {
        const box = document.getElementById("invite-box");
        box.style.display = (box.style.display === "block") ? "none" : "block";
    }
    function extractName(text) {
        text = text.replace(/[^a-zA-Z ]/g, " ");
        let words = text.split(/\s+/);
        const ignore = ["hiro","marker","camera","welcome","wedding","invitation","rahul","saira","weds","gate"];
        return words.filter(w => w.length >= 3 && w.length <= 12 && /^[A-Za-z]+$/.test(w) && !ignore.includes(w.toLowerCase()))[0] || "";
    }
    async function scan() {
        if (processing) return;
        processing = true;
        const video = document.querySelector("video");
        if (!video || video.readyState !== 4) { processing = false; setTimeout(scan, 1000); return; }
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let d = imgData.data;
        for (let i=0; i<d.length; i+=4) { let g = (d[i]+d[i+1]+d[i+2])/3; d[i]=d[i+1]=d[i+2]=g; }
        ctx.putImageData(imgData, 0, 0);
        try {
            const result = await Tesseract.recognize(canvas, 'eng');
            let name = extractName(result.data.text);
            if (name && name !== lastName) {
                lastName = name;
                let msg = `Dear ${name}, you are warmly invited to the wedding of Rahul and Saira.`;
                let displayMsg = `Dear ${name},\nYou are warmly invited to celebrate the wedding of\nRahul & Saira 💍\nPlease do come and bless us ❤️`;
                document.querySelector("#personal-msg").setAttribute("value", displayMsg);
                document.querySelector("#detected-name").setAttribute("value", name.toUpperCase());
                speak(msg);
            }
        } catch (err) { console.log(err); }
        processing = false;
        setTimeout(scan, 2500);
    }
    setTimeout(scan, 3000);
</script>
</body>
</html>
